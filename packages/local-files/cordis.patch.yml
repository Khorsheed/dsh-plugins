# local-files bundle patch: inserts the plugin row into the composing profile,
# so `dsh plugin --profile <name> add @khorsheed/dsh-local-files` reconciles it
# into the bundles layer. The row is a bare mount — every config field has a
# schema default.
#
# NOTE: a composition must mount this row id exactly once. Official images
# mount no local-files row, so plugin-adding this package is the install path
# there; a composition that already mounts the id by other means must NOT also
# add it — a duplicate loader entry id fails boot.
- insert:
    - id: local-files
      name: "@khorsheed/dsh-local-files"
