          # novel_write / novel_extract 再按会话绑定决定——会话绑定的是长篇小说画布才出现，
          # 其余画布照旧只有上面的画布工具。小说画布上的卡由 novel_write 直接落成正式卡，
          # canvas_write op=card 在那里让位（体裁的 agentCardTool）。profile 根的同名行出厂
