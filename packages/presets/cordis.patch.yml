# @khorsheed/dsh-presets bundle patch: the three community agent presets as
# declarative `@deepseek-ai/dsh-agent-preset` rows (host 0.1.7-rc.1 line — the
# row type does not exist on 0.1.5, see the package README's Compatibility).
#
#   preset-dev          开发模式  the 0.1.5 directory preset dev, REBASED onto
#                       rc.1's standard.patch.yml for the official part (the
#                       0.1.5 copy had drifted: workflow-worker-thread renamed
#                       to workflow-ptc, tool-ralph disabled upstream, the
#                       disabled tool-plugin-manager row added), then the live
#                       dev file's community tool rows appended verbatim.
#   preset-dsh-eval     评测模式  profiles/web-eval/presets/eval migrated; every
#                       official package name checked against the rc.1 roster —
#                       all still exist, zero renames.
#   preset-dsh-writing  写作模式  profiles/web/presets/dsh-writing migrated; the
#                       only rename is workflow-worker-thread → workflow-ptc.
#                       Tuned for the writing scene 2026-09-29: Chinese writer
#                       persona + style/punctuation rules, goal rows removed,
#                       plan-mode section rendered in Chinese — every prompt
#                       section this file owns is single-language Chinese.
#
# The display fields (name/description/order) come from each legacy preset.yml.
# Every `name:` value is quoted (@ is YAML-reserved; 'cordis:group' follows the
# same repo rule). `!!js` in nested disabled/config is evaluated by the Loader
# when the child plugin activates — the same mechanism standard.patch.yml uses.
- insert:
    - id: preset-dev
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dev
        name: '开发模式'
        description: 单实例多模式的开发场景：官方标准模式的全部能力，外加 local-agent 委派工具（kimi/codex/claude）与 worktrees 模型工具，按会话授予。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: 'cordis:group'
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: 'cordis:group'
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: 'cordis:group'
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true

          # ── dev mode: community tool rows granted per session ────────────────────────
          # The mode-switcher proposal (2026-08-26) dev mode: community MODEL TOOL rows
          # live in this preset, never at the profile root — a session gets the tool
          # exactly when it runs on this preset. Every row below provides no service
          # (the preset-mount isolate-realm rule) and only registers into the host
          # tools registry, so they compose bare, the official tool-row shape.

          # The three local-agent delegation tools, the web-eval patch layer's row
          # shape minus the `tools: none` pin (dormancy is the preset's own decision
          # here — naming the row grants the tool). Provider names match the family
          # rows the dev profile mounts at its root.
          - id: tool-subagent-kimi
            name: '@khorsheed/dsh-local-agent-tool-subagent'
            config:
              provider: kimi-cli
              toolName: subagent_kimi

          - id: tool-subagent-codex-local
            name: '@khorsheed/dsh-local-agent-tool-subagent'
            config:
              provider: codex-local
              toolName: subagent_codex

          - id: tool-subagent-claude-code-local
            name: '@khorsheed/dsh-local-agent-tool-subagent'
            config:
              provider: claude-local
              toolName: subagent_claude_code

          # The worktrees model tool: the core stays global (badge/tab/service), the
          # tool row is session-granted here. Since worktrees 0.3.0 the row ships
          # inside the core package as the `./tool` composition entry (the standalone
          # `@khorsheed/dsh-worktrees-tool` companion is folded away); the row id
          # stays `worktrees-tool`, so the composition state is unaffected.
          - id: worktrees-tool
            name: '@khorsheed/dsh-worktrees/tool'

          # The room model tools (invite/task/message), same split (M4'②): the core
          # stays global (room service/UI), the tool row is session-granted here.
          # Since room 0.2.0 the row ships inside the core package as the `./tool`
          # composition entry (the standalone `@khorsheed/dsh-room-tool` companion is
          # folded away); the row id stays `room-tool`, so the composition state is
          # unaffected. No config — the tools read the invitable provider roster from
          # the global room service at call time.
          - id: room-tool
            name: '@khorsheed/dsh-room/tool'

          # The TypeSafe judgement tool (2026-09-20): the core `@khorsheed/dsh-typesafe`
          # publishes `ctx.typesafe` at the profile root and stays surface-free; this row
          # grants `typesafe_judge`, its `typesafe:judge` guidance section and the
          # `typesafe-decide` skill to this preset's sessions only.
          - id: typesafe-tool
            name: '@khorsheed/dsh-typesafe-tool'

          # ── 评测三行已挪到 dsh-eval preset（2026-09-18）──────────────────────────────
          # mission/datasets/eval 的伴生工具行不再挂在本预设：它们的 tab/chip/slash 按
          # 「组合里有没有行」自隐，本预设带行 = 开发模式会话也显示评测 UI。评测能力归
          # dsh-eval preset（配方与 web-eval pack 的 eval preset 一致）。

    # The `eval` agent preset: the planning-and-analysis agent of an evaluation
    # instance, and the execution point of FROZEN DECISION 12 — "the destruction
    # path is unique: the evaluation instance's agent preset carries no Bash and no
    # docker; only the orchestrator holds the docker socket" (README「冻结决策」).
    #
    # This file is an AGENT-PLANE composition, mounted once per process under a
    # standing scope; every session naming this preset joins by scope parentage.
    # It is derived from the shipped `standard` preset (apps/cli/config/agent-presets/
    # standard/agent.cordis.yml in the harness), with two classes of row removed:
    #
    #   (a) anything that can run a host command —
    #       `tool-bash` / `tool-pwsh` (the shell itself), and `tool-workflow` plus
    #       the `workflow-ptc` engine it needs: a workflow script is
    #       MODEL-AUTHORED JavaScript executed as an async function body in a Node
    #       worker thread, so it reaches `node:child_process` without a shell in
    #       sight. `tool-ralph` drives the same engine and goes with it.
    #   (b) `plan-mode`, whose vocabulary collides with this line's own: its
    #       prompt plans an IMPLEMENTATION and forbids writing files, while this
    #       agent's whole output is a `dataseek.plan/1` written to disk and
    #       approved by a person through the eval flow. Two things called "plan"
    #       in one session is the confusion, not the missing capability.
    #
    # What stays is read, draft, and delegation to an agent running on THIS preset:
    # an in-process child inherits its parent's preset (the harness proves it in
    # subagent-in-process-driver/tests/preset-inheritance.spec.ts), so a delegation
    # cannot hand a child the shell this preset does not carry.
    #
    # WHAT THIS PRESET CANNOT REACH: the family delegation tools `subagent_codex` /
    # `subagent_claude_code` / `subagent_kimi` / `subagent_dsh` mount at the PROFILE
    # ROOT (each provider's own bundle patch inserts them), and a preset filters
    # nothing it does not mount. Those DO run host commands — that is their job, and
    # it is how the orchestrator drives the players. See the README section
    # 「冻结决策 12 的执行点」 for the gap and the options for closing it.
    #
    # A service row here MUST sit inside a group carrying an `isolate` realm;
    # without one it publishes into the process-global root realm and
    # `dsh-agent-presets` rejects the mount. Rows that only REGISTER into a host
    # registry (tools, skills) need no realm.
    - id: preset-dsh-eval
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-eval
        name: '评测模式'
        description: 评测实例的规划与分析 Agent：读题库、起草 plan 与 condition、读 bundle 写分析初稿；不挂 Bash，不挂容器控制。
        order: 0
        plugins:
          # ── identity ────────────────────────────────────────────────────────────────

          # `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
          # The persona states the missing shell on purpose: an agent that does not know
          # it has none spends turns discovering it, and the reason is not a defect it
          # should try to route around.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the planning and analysis agent of a dsh evaluation instance, powered by the {{model}} model. Your working directory is {{cwd}}.
                Execution belongs to the deterministic orchestrator: you read the dataset repository and finished run bundles, draft plan and condition files for a person to approve, and write analysis drafts.
                You have no shell and no container controls — that is the apparatus, not a gap to work around. Ask the person to run what needs running.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── filesystem: read, and draft ─────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so they
          # need no realm. `tool-fs` keeps `write`/`edit`: a plan, a condition and an
          # analysis draft are files, and writing one executes nothing. `glob`/`grep`
          # spawn the packaged ripgrep binary through `ctx.subprocess` rather than a
          # shell, and take no command from the model — they are read tools.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # The task REGISTRY stays on the host plane; these are the model-facing
          # controls only. With the shell gone the sole producer left is a continuable
          # `tool-subagent` child, which is exactly what these collect and stop.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill registry is host-plane and layered per scope: these rows register
          # into THIS preset's layer, and the merged catalog also carries whatever the
          # profile registered globally. I5's `eval-planning` skill arrives this way.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────

          # Only the model-facing tool; the goal service and its `/goal` command stay on
          # the host plane. Goal state is bookkeeping — it starts nothing.
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── compaction ──────────────────────────────────────────────────────────────

          # Reading bundles is long-context work, so this preset compacts. The pruner
          # shares the realm because `compaction-basic` resolves `toolResultPrune`
          # through `ctx.get`; the token meter deliberately stays on the host plane.
          - id: compaction
            name: 'cordis:group'
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation ──────────────────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends are host-plane
          # singletons; a preset chooses only which delegation TOOLS its agent sees.
          # Both backends produce in-process dsh children, and a child runs on its
          # parent's preset — so a delegated reader is as shell-less as its parent.
          #
          # No `workflowEngine` realm here, unlike the shipped `standard` preset: the
          # rows that needed it are the three this preset drops.
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'

          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              backgroundMode: continuable

          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session. `fetch: false` matches the shipped
          # presets: `web_search` only.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

          # ── 工具按域开放（M4'③：companion 行按域授予）──────────────────────────────
          # 这两行原先挂在 profile 根并带 tools 配置（profiles/web-eval/cordis.patch.yml）。
          # 拆包后工具行不再全局：授予点移到这里，tier 原样跟随——eval 预设的会话拿到
          # 按域裁剪过的两个工具集，同 profile 里其它预设的会话一个都拿不到。
          #
          # `mission-tool` 曾是这里的第三行（`tools: read`，四个只读工具）。T46 摘掉：
          # 界面规格的 R6 定了「评测模式下 mission 这个词不出现」——mission 仍是这条线的
          # 账本与释放闸，但那是编排器服务面的事，模型侧读进度走 eval 自己的投影
          # （`eval_cells`，见下一行的 eval-tool）。摘掉这一行还有第二个效果，是同一条
          # 规则的另一半：宿主的任务 tab 按「当前会话的预设组合里有没有
          # @khorsheed/dsh-mission-tool 行」自隐（mission 的 preset-visibility），所以
          # 这一行一走，评测会话的任务 tab 自己就不见了，不必再关一次。
          # 包本身仍随 pack 安装（package.json 的成员清单里），谁要在自己的覆盖层预设里
          # 加回这一行都还装得上——钉的是默认值，不是可达集。
          - id: datasets-tool
            name: '@khorsheed/dsh-datasets-tool'
            config:
              tools: authoring      # 读类全开 + put_item（出题）；worktree_path 留给服务面

          - id: eval-tool
            name: '@khorsheed/dsh-eval-tool'
            config:
              tools: all            # 本包只注册四个读工具，all 即四个读工具

    # The `dsh-writing` agent preset: the Chinese-writing workbench, mounted once
    # per process. Migrated from profiles/web/presets/dsh-writing (the 0.1.5
    # directory preset; the only rename was workflow-worker-thread →
    # workflow-ptc), then tuned for the writing scene on 2026-09-29:
    #   - the persona is a Chinese writer identity carrying the plain-language
    #     style rules and the punctuation rule, replacing the coding-agent one;
    #   - the goal rows are gone (autonomous goal-pursuit is a coding workflow
    #     the writing scene never drives);
    #   - every prompt section this file owns is single-language Chinese —
    #     mixed-language prose measurably hurts the model's output voice, and
    #     the residual English (tool catalogs, official sections this file does
    #     not own) is outside our reach here.
    #
    # This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
    # standing scope; every session naming it joins by scope parentage, so the
    # tools and prompt sections registered here cover each joined agent while a
    # session's own state stays keyed per Session/Agent inside the plugins. A
    # service row here MUST sit inside a group carrying an `isolate` realm —
    # without one it publishes into the root realm, where it is process-global,
    # and `dsh-agent-presets` rejects that at mount. `true` means an
    # entry-local realm: this standing mount's own private instance.
    - id: preset-dsh-writing
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-writing
        name: '写作模式'
        description: 中文写作工作台：写作身份与文风约束、文件与网页检索、Skills、计划模式、子代理，以及按会话授予的画布协作工具。
        plugins:
          # ── identity ────────────────────────────────────────────────────────────────

          # The preset's own persona, shadowing the deployment default for this agent.
          # `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
          # The prefix carries the writing-scene rules: plain modern Chinese for a
          # general reader (no coined words), and punctuation following the output
          # language (full-width in Chinese sentences, never a half-width comma there).
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: 你的工作目录是 {{cwd}}。
              prefix: >-
                你是一名中文写作者，由 {{model}} 模型驱动。

                默认面向没有行业背景的普通读者，目标是让内容清楚、自然、好懂。风格平实、具体、直接、克制：清楚优先于高级感。使用现代汉语常用词，优先选择日常对话、正规新闻、教科书里常见的表达；禁止生造词。

                标点跟着输出语言走：写中文用全角标点（，。；：？！“”‘’（）——……），写英文用半角标点；中文句子里不要出现英文逗号、句号。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane:
          # its producers sit outside any realm this file could put it in — `tool-bash`
          # above resolves it with `ctx.get`, and an entry-local realm here is invisible
          # to every sibling row, so `run_in_background` would answer "background jobs
          # unavailable" while these controls sat in the catalog. The registry is keyed by
          # owning agent anyway, so one host instance serves every session. What a preset
          # chooses is whether its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset, and
          # `tool-skill` gives them the catalog and loader; the merged catalog also
          # carries whatever the deployment registered globally (repository plugins).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals: NOT here ─────────────────────────────────────────────────────────

          # Goal mode (autonomous objective pursuit) is a coding workflow the writing
          # scene never drives — the /goal command and the goal tool stay out of this
          # preset (2026-09-29 writing-scene tuning). The host-plane goal service is
          # untouched; the dev and dsh-eval presets keep their rows.

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime. The section text is the
          # faithful Chinese rendering of the official plan-mode rules (this preset
          # keeps every prompt section it owns single-language Chinese, 2026-09-29);
          # tool identifiers stay verbatim.
          - id: planning
            name: 'cordis:group'
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        你正处于计划模式。在 exit_plan_mode 成功、或用户切换会话模式之前，一直留在计划模式。「去实现什么」的祈使句意味着规划这个实现，而不是执行它。用户在对话里的同意——包括回答你提出的问题——不构成批准，也不会结束计划模式；把确认的决定并入计划，通过 exit_plan_mode 提交。

                        先探索。用非修改性的读取、搜索、静态分析和检查，让计划扎根于真实的仓库。不要编辑或写入文件、不要改配置、不要运行会改写已跟踪文件的格式化或代码生成、不要提交，也不要以任何其他方式执行计划。优先复用现有函数与模式，不造新机制。

                        工具目录跨模式保持不变，以保证请求缓存稳定。这些计划模式规则覆盖后续任何暗示可以使用修改类工具的工具描述或指引；那些工具仍然列在目录里，只为保持目录不变。不要用 todo_write 跟踪这个规划阶段：它跟踪的是计划获批后的实现，而计划本身属于 exit_plan_mode。

                        能查证的事实就自己查证。ask_user_question 只用于只能由用户决定的选择、或查证无法回答的实质歧义。能自己找到答案时，不要问用户代码在哪里、现状如何运作。

                        让计划决策完备：写明目标与成功标准；按子系统分组实现改动；指出公开 API、schema 与数据流的变化；覆盖边界情况、失败模式、测试、验收标准和显式假设。简洁到可以审阅，详细到另一个工程师无需再做设计决策即可实现。

                        准备好后，调用 exit_plan_mode，附上以 # 标题开头的完整计划 markdown。让 exit_plan_mode 成为该回复中唯一且最后的工具调用：它把计划呈交批准，实现在获批后的后续步骤才开始。不要把最终计划作为普通回复贴出，也不要用散文或 ask_user_question 问「我可以开始吗」。审阅驳回时，吸收反馈后再次提交。如果审阅通道不可用或已中止，留在计划模式，请用户手动切换模式；不要自行开始实现。

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
          # share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance. It takes no configuration,
          # keys every fold by Session, and owns the context-meter projection units the
          # browser reads for every session — behind a realm those units would come and go
          # with whichever presets happen to be mounted. What a preset chooses is whether
          # its agent compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: 'cordis:group'
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so every row
          # that reaches it shares one entry-local realm here, and a consumer left
          # outside would resolve a host registry this preset does not populate.
          - id: delegation
            name: 'cordis:group'
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              # Fork omits model selection so provider/model stay equal to the parent and
              # the inherited history remains eligible for KV Cache reuse. This preset
              # keeps fork continuable; parent and child inherit the same messaging tool,
              # while the parent id and return guidance follow the inherited history.
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # Production dsh does not install these optional providers. Install the
              # matching Bundle in this Profile and restart the Host, then copy this
              # preset and remove `disabled` from the matching tool row. Host availability
              # alone grants no tool.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── inspiration canvas ──────────────────────────────────────────────────────

          # 画布会话工具（2026-09-17）：canvas_propose_card / canvas_comment 与引导段只
          # 授予本 preset 的会话；profile 根的同名行已在 cordis.patch.yml 停用，两者绝不
          # 同时生效（同名工具双注册）。服务核心（canvasBoard）由 profile 根的 canvas 行
          # 提供，本行沿 scope 父链解析；画布未装时本行降级为零注册。
          - id: canvas-agent
            name: '@khorsheed/dsh-canvas/agent'
