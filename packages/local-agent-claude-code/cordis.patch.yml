# The dsh-local-agent-claude-code bundle patch: delegate dsh agents to the
# local Claude Code CLI under a scoped CLAUDE_CONFIG_DIR, and surface its
# session records. The family core row (`local-agent`, shared scoped-homes
# root) ships in the framework bundle @khorsheed/dsh-local-agent's own
# patch, which this bundle declares as a dependency — so installing this
# bundle alone still mounts the core, and no two patches insert the same row
# id.
#
# Two rows are inserted:
#   - local-agent-claude-code: this bundle's plugin registers the
#     `claude-code` harness (CLAUDE_CONFIG_DIR scoped home,
#     `claude auth login` browser flow, project-file session records).
#   - tool-subagent-claude-code-local: the family-owned delegation tool
#     (schema description/prompt plus optional resume) over the `claude-local`
#     provider. The toolName is `subagent_claude_code` — the family takes the
#     model-facing name: the official preset row of that name ships
#     `disabled: true`, and this patch disables it too (below) so a community
#     install can never register two `subagent_claude_code` tools. A user who
#     deliberately re-enables the official row in their own preset layer gets
#     a loud duplicate-name conflict — by design, they must choose one. The
#     family tool adds continuation: a later round may pass the dsh child
#     session id returned by the first delegation to continue the same claude
#     conversation.
#
# The tool mounts at the profile root, so every agent preset can delegate
# without per-preset variants. The provider starts no claude process until a
# tool call or /claude-code login.

- id: tool-subagent-claude-code
  disabled: true

- insert:
    - id: local-agent-claude-code
      name: '@khorsheed/dsh-local-agent-claude-code'

    - id: tool-subagent-claude-code-local
      name: '@khorsheed/dsh-local-agent-tool-subagent'
      config:
        provider: claude-local
        toolName: subagent_claude_code
