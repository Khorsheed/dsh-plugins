# @khorsheed/dsh-library bundle patch: inserts the library row into the
# composing profile, so `dsh plugin --profile <name> add @khorsheed/dsh-library`
# reconciles it into the bundles layer. The row is a bare mount — the host half
# provides the `library` service core and mounts its thin Remote face; the
# browser half is discovered through the package.json `dsh.client` block. The
# model face (library_read / library_write / library_assess + the coach prompt
# section + the library skill) is NOT this row: it is the `./tool` composition
# entry, which an agent preset names (the evaluation-family fold pattern) — a
# profile-root tool row would grant every session.
#
# NOTE: a composition must mount this row id exactly once. Official images
# mount no library row, so plugin-adding this package is the install path
# there; a composition that already mounts the id by other means must NOT also
# add it — a duplicate loader entry id fails boot.
- insert:
    - id: library
      name: "@khorsheed/dsh-library"
