# canvas bundle patch: inserts the plugin rows into the composing profile, so
# `dsh plugin --profile <name> add @khorsheed/dsh-canvas` reconciles it into the
# bundles layer. The first row is a bare mount — the host half provides the
# `canvasStore`/`canvasBoard` services and mounts its Remote face; the browser
# half is discovered through the package.json `dsh.client` block.
#
# NOTE: a composition must mount this row id exactly once. Official images
# mount no canvas row, so plugin-adding this package is the install path there;
# a composition that already mounts the id by other means must NOT also add it
# — a duplicate loader entry id fails boot.
#
# The second row mounts the `./agent` composition entry: the main-session
# canvas tools (canvas_read / canvas_write / canvas_propose_type), their
# guidance section and the `canvas` skill, live for EVERY session — the community default, and the pre-0.4.2
# status quo. A preset may ALSO name `@khorsheed/dsh-canvas/agent` in its own
# composition (the writing mode pack does): under host 0.2.x that no longer
# fails the boot — a preset session sees its scoped copy shadow this global
# row (the host pins the shadowing in
# packages/core/tools/tests/scoped.spec.ts), and sessions on other presets
# keep the global one. What keeps a mode pack's grant semantics exact is that
# the pack's own patch never re-mounts this row at the profile root — the
# grant lives only in the preset composition.
- insert:
    - id: canvas
      name: "@khorsheed/dsh-canvas"
    - id: canvas-agent
      name: "@khorsheed/dsh-canvas/agent"
