# eval bundle patch: inserts the eval row into the composing profile,
# so `dsh plugin --profile <name> add @khorsheed/dsh-eval` reconciles it
# into the bundles layer (apps/cli plugin.ts reconcilePlugins). The row is a
# bare mount — the offline verbs (validate / conditions hash) need no config.
#
# NOTE: a composition must mount this row id exactly once. Official images
# (the published npm line and upstream master) mount no eval row, so
# plugin-adding this package is the install path there; a composition that
# already mounts the id by other means must NOT also add it — a duplicate
# loader entry id fails boot. Check first:
# `dsh --profile <name> --dump-config | grep eval`.
- insert:
    - id: eval
      name: "@khorsheed/dsh-eval"
