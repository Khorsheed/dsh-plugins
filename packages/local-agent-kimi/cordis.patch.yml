# The dsh-local-agent-kimi bundle patch: register the Kimi harness and mount
# its delegation tool. The family core row (`local-agent`, shared scoped-homes
# root) lives in the framework bundle @khorsheed/dsh-local-agent's own patch.
# This bundle declares that package as an npm dependency, which makes the
# core's module resolvable — it does NOT mount the core row: `dsh plugin add`
# reconciles only the profile's direct dependencies, so the core must be
# installed explicitly alongside this bundle, or this provider stays pending.
# No other patch inserts the core row id.
#
# Two rows are inserted:
#   - local-agent-kimi: this bundle's plugin registers the `kimi` harness
#     (KIMI_CODE_HOME, `kimi login`, session_index records).
#   - tool-subagent-kimi: the family-owned delegation tool (schema
#     description/prompt plus optional resume) over the `kimi-cli` provider.
#     The toolName stays `subagent_kimi` — the same model-facing name the
#     official tool-subagent row used — so presets and prompts keep working,
#     while the family tool adds continuation: a later round may pass the dsh
#     child session id returned by the first delegation to continue the same
#     kimi conversation.
#
# The subagent_kimi tool row mounts at the profile root, so every agent
# preset (standard/code/minimal/cordis and future ones) can delegate without
# per-preset variants. The provider starts no Kimi process until a tool call
# or /kimi login.

- insert:
    - id: local-agent-kimi
      name: '@khorsheed/dsh-local-agent-kimi'

    - id: tool-subagent-kimi
      name: '@khorsheed/dsh-local-agent-tool-subagent'
      config:
        provider: kimi-cli
        toolName: subagent_kimi
