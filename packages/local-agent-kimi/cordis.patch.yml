# The dsh-local-agent-kimi bundle patch: register the Kimi harness. The family
# core row (`local-agent`, shared scoped-homes root) lives in the framework
# bundle @khorsheed/dsh-local-agent's own patch. This bundle declares that
# package as an npm dependency, which makes the core's module resolvable — it
# does NOT mount the core row: `dsh plugin add` reconciles only the profile's
# direct dependencies, so the core must be installed explicitly alongside this
# bundle, or this provider stays pending. No other patch inserts the core row
# id.
#
# Exactly ONE row is inserted: the provider (this bundle's plugin registers the
# `kimi` harness — KIMI_CODE_HOME, `kimi login`, session_index records). The
# `subagent_kimi` delegation tool is no longer a profile-root row: since the
# family fold it ships as this package's `./tool` composition entry
# (`name: '@khorsheed/dsh-local-agent-kimi/tool'` in an agent preset), granted
# per session — the dev preset's `tool-subagent-kimi` row is the grant point.
# The model-facing toolName stays `subagent_kimi` and the tool keeps its
# continuation parameter: a later round may pass the dsh child session id
# returned by the first delegation to continue the same kimi conversation.
#
# The provider starts no Kimi process until a tool call or /kimi login.

- insert:
    - id: local-agent-kimi
      name: '@khorsheed/dsh-local-agent-kimi'
