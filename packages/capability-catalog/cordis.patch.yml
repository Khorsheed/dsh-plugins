# capability-catalog bundle patch: inserts the plugin row into the composing
# profile. The browser half (settings.plugin.item card) is discovered through
# the package.json dsh.client block; this row activates the host half (the
# skills snapshot + add-skill Remote). The @-prefixed name must stay quoted —
# it is a YAML reserved character.
- insert:
    - id: capability-catalog
      name: '@khorsheed/dsh-capability-catalog'
