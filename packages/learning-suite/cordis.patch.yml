# @khorsheed/dsh-learning-suite bundle patch: the 学习模式 (dsh-learning) mode pack —
# the member rows (library, and since 2026-10-19 the reader; the canvas left
# 2026-10-26 — not shipping in this release wave)
# plus the mode's own preset row. The member row is
# re-mounted VERBATIM from the member package's own cordis.patch.yml (the
# canonical row); the preset row is canonical here (the @khorsheed/dsh-presets copy it once
# mirrored retired 2026-10-24).
# check-plugin-independence's `mode` sanction pins this file to exactly the
# member's rows plus the one preset row.
#
# Why no double mount: `dsh plugin add` reconciles only the profile's DIRECT
# dependencies into the bundles layer (apps/cli plugin.ts reconcilePlugins).
# Installing this bundle applies THIS patch only; the member package arrives as
# a transitive npm dependency and its own patch stays inert. Installing the
# member directly alongside still self-mounts it — the official bundle detail
# page's row-level switches resolve any overlap.
#
# The library's MODEL face (library_read / library_assess / the coach prompt
# section / the library skill) is not a profile-root row by design: it ships as
# the library package's `./tool` composition entry, granted per session by THIS
# bundle's preset row (its `library-tool` row). The reader's `./tool` row is
# granted the same way (`reader-tool`), and its right-Sidebar tab self-hides on
# that row.
- insert:
    # 图书馆: the library service core and the learning sidebar.
    - id: library
      name: "@khorsheed/dsh-library"

    # 灵感空间: RSS feeds and saved article links on a card wall (row id `reader`).
    - id: reader
      name: "@khorsheed/dsh-reader"

    # 本机转写: the `transcribe` service (local ASR) the members probe for.
    - id: transcribe
      name: '@khorsheed/dsh-transcribe'

    # 渲染抓取: headless-Chrome render of JS-heavy pages, for the reader's 渲染抓取.
    - id: capture
      name: "@khorsheed/dsh-capture"

    - id: preset-dsh-learning
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-learning
        name: '学习模式'
        description: 按项目精读的学习模式：图书馆（书籍/路线/知识卡片/测验）与精读教练；不限定教材时，教练选书或自编教材、按学习顺序编号，每本一条路线，动手站按交付物验收——只在选择此预设的会话里生效。
        order: 12
        plugins:
          # ── identity ────────────────────────────────────────────────────────

          # The preset's own persona, shadowing the deployment default for this
          # agent. Light on purpose: the mechanics live beside the tools —
          # payload shapes in the library_* tool descriptions, the chapter
          # convention and the evidence gate in the library's own prompt
          # section (tool:library, ~500 tokens), correct usage re-taught by
          # every refusal. The persona names the stance (a coach who reads
          # WITH the learner) and repeats the two facts that must hold every
          # turn (the library tools are the memory; a judged quiz is ledgered,
          # or it never happened) — the overlap with the library section is
          # deliberate redundancy for the two non-negotiables.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a close-reading coach. You read WITH the learner, not for them:
                explain as you go and ask before moving on — a Socratic follow-up beats a
                summary. The goal is not to finish the book; it is that the learner can
                answer for it.

                - Reply in the learner's language.
                - The library is the memory: books, roadmaps, the learner's knowledge cards
                  and quizzes live in the library_* tools, never in conversation memory.
                - Never invent what a book says. The book and the learner's photos win over
                  what you remember; when you teach from domain knowledge, say so.
                - The learner's own weak points come first — in what you explain, what you
                  ask, and what you quiz.
                - Grading is two steps: judge in the conversation, then library_assess —
                  the assess is what moves the cards and unlocks the next node.
                - Ask with a card what a card asks well (editions, budget, weekly hours —
                  enumerable facts); ask in prose what only prose carries (goals, motives,
                  curiosity). Never let checkboxes shrink the learner's answer.
                - Diagnose before you draft, against the goal's own capability stack —
                  never a generic checklist. Decompose what the goal demands (programming,
                  math, domain ground, tooling, time, equipment), then probe each
                  capability with a pointed question, one dimension at a time ("Python:
                  functions, classes, NumPy — which have you actually used?", not "how is
                  your programming and math?"). Ask what draws the learner here. Then
                  draft — and let every answer visibly shape the path: skip what they
                  already have, slow down where they are thin.

                Some projects have no textbook — or need several. Then you choose them:
                an existing book or digital course that fits (only the chapters the goal
                needs), or, when nothing fits, a textbook you author yourself. A broad goal
                becomes a numbered series of textbooks, one per area, in the order to learn
                them; each gets its own path. Name real sources, never your memory posing
                as one: verify a book or link on the web before you claim it; a source the
                learner hands you is theirs. A station may gate on a quiz or on a
                deliverable: judge each acceptance criterion against the evidence the
                learner submits, then library_assess with the node.

          # ── ask the person ──────────────────────────────────────────────────

          # Which project, which book, which edition — the coach asks with a card.
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # ── web ─────────────────────────────────────────────────────────────

          # Verifying a book's edition and contents, and quoting a web copy of a
          # passage, are part of the learning loop.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # ── skills (a whitelist, not the floodgate) ──────────────────────────

          # The skill tool + per-step catalog, WITHOUT skill-filesystem: no
          # default-root provider runs in this composition, so no local skill
          # enters the registry from here. The only skills a learning session
          # sees are the ones explicitly scoped to it through the capability
          # catalog's managed delivery — scoped delivery turns the old
          # all-or-nothing choice (the registry would surface unrelated local
          # skills) into a whitelist. tool-skill injects agents/tools/skills,
          # all resolvable up the scope chain; the skill registry itself is
          # root-mounted. A scoped skill's bundle files stay readable through
          # the catalog's read-only read_skill_file reader, so fs stays dropped.
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── shell (guarded by the session's own sandbox + ask approval) ─────

          # Curl-style skills (weread) need a transport; the capability catalog
          # injects their configured credentials into the model shell as
          # DSH_<KEY>, so the raw key never enters the model's context. The
          # diet's "no shell" line was already honored only in the letter —
          # root-granted subagent tools let the model delegate the same commands
          # to a child running danger-full-access — so the honest boundary is
          # the session's own workspace-write sandbox + ask approval on every
          # command, which is strictly tighter than the delegation path. The
          # platform split follows the standard preset (bash off Windows, pwsh
          # on it); tool-bash injects tools/shell/systemPrompt/shellEnv, all
          # host-plane and resolvable up the scope chain.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── compaction (the standard preset's proven shape) ─────────────────

          # Long sessions fold context: `compaction-basic` reads
          # `toolResultPrune` through `ctx.get`, so the pruner shares this
          # realm; `tokenMeter` stays on the host plane.
          - id: compaction
            name: 'cordis:group'
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── the library grant ────────────────────────────────────────────────

          # library 三工具（library_read + 每个名词一个写工具 + library_assess）、
          # 教练指引段与每轮的绑定上下文只授予本 preset 的会话。服务核心
          # （library）由 profile 根的 library 行提供，本行沿 scope 父链解析；
          # library 未装时本行降级为 pending（注册表显示 waiting for library），
          # 装上即生效。hideSections / denyTools 把根上与学习无关的段落和工具
          # 在本 scope 里静音（名字不存在时跳过，不炸）。
          - id: library-tool
            name: '@khorsheed/dsh-library/tool'
            config:
              tools: all
              hideSections:
                - 'harness:source'
                - 'app:web-surface'
                - 'ui:deliverable-file-references'
              denyTools:
                - list_capabilities

          # ── the reader grant ────────────────────────────────────────────────────────

          # 灵感空间工具（reader_read / reader_note 与 reader 技能，2026-10-19）只授予
          # 本 preset 的会话；灵感空间页签按同一行双查自隐，只在授予它的会话里出现。
          # 服务核心（reader / readerNotes）由 profile 根的 reader 行提供，本行沿 scope
          # 父链解析；灵感空间未装时本行降级为零注册。
          - id: reader-tool
            name: '@khorsheed/dsh-reader/tool'
