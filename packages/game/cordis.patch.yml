# game bundle patch: inserts the plugin rows into the composing profile, so
# `dsh plugin --profile <name> add @khorsheed/dsh-game` reconciles it into the
# bundles layer. The first row is a bare mount — the host half provides the
# `gameStore` service, mounts its Remote face and runs the end-of-turn checks
# for sessions bound to a game project; the browser half is discovered
# through the package.json `dsh.client` block.
#
# NOTE: a composition must mount each row id exactly once — a duplicate loader
# entry id fails boot.
#
# The second row is the `./agent` composition entry (game_open / game_read,
# the mode's guidance section, the gamedev and game-design skills), live for
# EVERY session — the community default (the canvas `./agent` pattern). The
# game-development mode pack (@khorsheed/dsh-gamedev-suite) does NOT re-mount this
# row: it grants the same entry inside its preset composition, and under host
# 0.2.x a preset session's scoped copy shadows this global row
# (packages/core/tools/tests/scoped.spec.ts), so the two coexist — no
# `disabled: true` handle is needed on either side.
- insert:
    - id: game
      name: "@khorsheed/dsh-game"
    - id: game-agent
      name: "@khorsheed/dsh-game/agent"
