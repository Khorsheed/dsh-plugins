# @khorsheed/dsh-video-suite bundle patch: the 剪辑模式 (dsh-video) mode pack — the
# video-studio member row plus the mode's own preset row. The member row is
# re-mounted VERBATIM from the member package's own cordis.patch.yml (the
# canonical row); the preset row is canonical here (the @khorsheed/dsh-presets copy it once
# mirrored retired 2026-10-24).
# check-plugin-independence's `mode` sanction pins this file to exactly the
# member's rows plus the one preset row.
#
# Why no double mount: `dsh plugin add` reconciles only the profile's DIRECT
# dependencies into the bundles layer (apps/cli plugin.ts reconcilePlugins).
# Installing this bundle applies THIS patch only; the member package arrives as
# a transitive npm dependency and its own patch stays inert. Installing the
# member directly alongside still self-mounts it — the official bundle detail
# page's row-level switches resolve any overlap.
#
# The video_* TOOLS are not here by design: they ship as the video-studio
# package's `./tool` composition entry, granted per session by THIS bundle's
# preset row (its `video-studio-tool` row) — a profile-root row would grant
# every session.
#
# The multi-agent family (2026-10-24): the local-agent core, the four
# delegation providers and the room, mounted VERBATIM from their own patches
# (the same rows bundle-local-agent and dev mount). The two bare overrides
# disable the official preset rows whose model-facing tool names the codex /
# claude-code providers take.
- id: tool-subagent-codex
  disabled: true

- id: tool-subagent-claude-code
  disabled: true

- insert:
    # 剪辑: the videoStudio service (project store, media jobs) and the 剪辑 panel.
    - id: video-studio
      name: "@khorsheed/dsh-video-studio"

    # 本机转写: the `transcribe` service (local ASR) the members probe for.
    - id: transcribe
      name: '@khorsheed/dsh-transcribe'

    # The family core: shared scoped-homes root.
    - id: local-agent
      name: '@khorsheed/dsh-local-agent'
      config:
        homesRoot: !!js dshHomePath('local-agent')

    # Kimi harness (its `subagent_kimi` tool: the package's ./tool entry).
    - id: local-agent-kimi
      name: '@khorsheed/dsh-local-agent-kimi'

    # Codex harness (its `subagent_codex` tool: the package's ./tool entry).
    - id: local-agent-codex
      name: '@khorsheed/dsh-local-agent-codex'

    # Claude Code harness (its `subagent_claude_code` tool: the package's ./tool entry).
    - id: local-agent-claude-code
      name: '@khorsheed/dsh-local-agent-claude-code'

    # The dsh harness controller (Settings → 本地 Agent switch, default off).
    - id: local-agent-dsh
      name: '@khorsheed/dsh-local-agent-dsh'

    # 协作间: multi-member rooms; its members are the local agents above plus
    # native dsh sub-members (probes localAgent, degrades without it).
    - id: room
      name: '@khorsheed/dsh-room'

    # 快速决策: the room's 自动判断 (task merging, report timing) asks it; without
    # it the room falls back to "new message = new task, report on arrival".
    - id: typesafe
      name: '@khorsheed/dsh-typesafe'

    - id: preset-dsh-video
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-video
        name: '剪辑模式'
        description: 播客与对谈剪辑：一条混录自动分人、节目声纹认人、删字即删音频；会话里商量剪什么，右栏剪辑面板调细节，导出音频、视频、字幕和 shownotes。
        plugins:
          # ── identity ────────────────────────────────────────────────────────────────

          # 剪辑搭档的身份（2026-10-06 剪辑台 M1）。工具机制写在 video-studio 技能里，
          # 这里只放身份、语言和协作原则；单语英文，与宿主提示同一种声音。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are an editing partner for podcasts, casual chats and conversations, powered by the {{model}} model. You reply in the user's language.

                ## How you work

                - The user and their friends usually record everyone on ONE device (a mixed recording), often with a phone filming. The 剪辑 panel on the right is the same project you edit through the video_* tools: what you change, the user sees there; what they change there, you read back with video_read.
                - Every change you make is a proposal the user accepts or rejects. Never apply a proposal unless the user said so in the conversation.
                - Times you use are seconds of the ORIGINAL recording. Output timestamps (shownotes, subtitles, durations) come from the tools; never estimate them.
                - In a mixed recording you cannot remove one person's voice: cutting a range removes everyone in it. Say so when it matters.
                - Load the `video-studio` skill at the start of an editing session and follow its workflow.

                ## Taste

                Keep the conversation's warmth: trim fillers, dead air and repetition, and suggest cutting off-topic stretches with a one-line reason each. Leave the decisions about what a friend said to the user.

          # ── filesystem ──────────────────────────────────────────────────────────────

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          # ── skills ──────────────────────────────────────────────────────────────────

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── compaction ──────────────────────────────────────────────────────────────

          - id: compaction
            name: 'cordis:group'
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # ── multi-agent (2026-10-24) ────────────────────────────────────────────────

          # Delegation to the local CLI agents and the room, granted to this
          # preset's sessions only. The provider rows they run on mount at the
          # profile root from this pack's own patch. tool-subagent-control /
          # list-agents let the agent wait on, read and stop the runs it started
          # (the official spawn/fork tools stay out — this mode delegates to the
          # local agents, not to in-process dsh children).
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'

          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

          - id: tool-subagent-kimi
            name: '@khorsheed/dsh-local-agent-kimi/tool'

          - id: tool-subagent-codex-local
            name: '@khorsheed/dsh-local-agent-codex/tool'

          - id: tool-subagent-claude-code-local
            name: '@khorsheed/dsh-local-agent-claude-code/tool'

          # room_invite / room_message / room_read / room_plan; the room service
          # and UI stay at the profile root.
          - id: room-tool
            name: '@khorsheed/dsh-room/tool'

          # typesafe_judge, its typesafe:judge guidance and the typesafe-decide skill
          # (where the API key is entered) for this preset's sessions; the service
          # itself (ctx.typesafe) is the profile-root typesafe row above.
          - id: typesafe-tool
            name: '@khorsheed/dsh-typesafe/tool'

          # ── video studio ────────────────────────────────────────────────────────────

          # video_* 工具与 video-studio 技能只授予本 preset 的会话（worktrees ./tool
          # 写法：profile 根不挂这一行）。服务核心（videoStudio）由 profile 根的
          # video-studio 行提供，本行 inject 它；未装时本行 pending、零注册。
          - id: video-studio-tool
            name: '@khorsheed/dsh-video-studio/tool'
