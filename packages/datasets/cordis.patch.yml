# datasets bundle patch: inserts the plugin row into the composing profile, so
# `dsh plugin --profile <name> add @khorsheed/dsh-datasets` reconciles it into
# the bundles layer (apps/cli plugin.ts reconcilePlugins). The row is a bare
# mount — every config field has a schema default.
#
# NOTE: a composition must mount this row id exactly once. Official images
# (the published npm line and upstream master) mount no datasets row, so
# plugin-adding this package is the install path there. Check first:
# `dsh --profile <name> --dump-config | grep datasets`.
- insert:
    - id: datasets
      name: "@khorsheed/dsh-datasets"
