# @khorsheed/dsh-bundle-local-agent bundle patch: the multi-agent family as one
# bundle card — the local-agent core row, the four delegation provider rows and
# the room (协作间, whose members are these local agents) and Context Lens
# (see what each member received and where its time went),
# re-mounted VERBATIM from each member package's own cordis.patch.yml (the
# canonical rows; check-plugin-independence's `family` sanction pins this file
# to exactly that union — no invented ids, no foreign rows).
#
# Why no double mount: `dsh plugin add` reconciles only the profile's DIRECT
# dependencies into the bundles layer (apps/cli plugin.ts reconcilePlugins).
# Installing this bundle applies THIS patch only; the member packages arrive as
# transitive npm dependencies and their own patches stay inert. Installing a
# member directly alongside still self-mounts that member — the official bundle
# detail page's row-level switches resolve any overlap.
#
# The two bare overrides disable the official preset rows whose model-facing
# tool names the family takes (subagent_codex / subagent_claude_code) — carried
# verbatim from the codex / claude-code providers' own patches.
#
# The delegation TOOLS are not here by design: since the family fold each
# provider ships its tool as its own `./tool` composition entry
# (`@khorsheed/dsh-local-agent-kimi/tool` etc.), which an agent preset names to
# grant the tool per session — a profile-root row would grant every session.
# The dev preset's `tool-subagent-kimi` / `tool-subagent-codex-local` /
# `tool-subagent-claude-code-local` rows are the grant points.
#
# The deps-only family library (@khorsheed/dsh-local-agent-dsh-headless) is an
# npm dependency of this bundle but contributes NO row here beyond what the
# members' canonical rows already name — card-less by design (see the
# family-bundles proposal).

- id: tool-subagent-codex
  disabled: true

- id: tool-subagent-claude-code
  disabled: true

- insert:
    # The family core: shared scoped-homes root.
    - id: local-agent
      name: '@khorsheed/dsh-local-agent'
      config:
        homesRoot: !!js dshHomePath('local-agent')

    # Kimi harness (its `subagent_kimi` tool: the package's ./tool entry).
    - id: local-agent-kimi
      name: '@khorsheed/dsh-local-agent-kimi'

    # Codex harness (its `subagent_codex` tool: the package's ./tool entry).
    - id: local-agent-codex
      name: '@khorsheed/dsh-local-agent-codex'

    # Claude Code harness (its `subagent_claude_code` tool: the package's ./tool entry).
    - id: local-agent-claude-code
      name: '@khorsheed/dsh-local-agent-claude-code'

    # The dsh harness controller (Settings → 本地 Agent switch, default off).
    - id: local-agent-dsh
      name: '@khorsheed/dsh-local-agent-dsh'

    # 协作间: multi-member rooms; its members are the local agents above plus
    # native dsh sub-members (probes localAgent, degrades without it).
    - id: room
      name: '@khorsheed/dsh-room'

    # 快速决策: the room's 自动判断 (task merging, report timing) asks it; without
    # it the room falls back to "new message = new task, report on arrival".
    - id: typesafe
      name: '@khorsheed/dsh-typesafe'

    # 上下文透镜: per-turn request and timing breakdown, sub-agents included —
    # how you see what each member is actually doing.
    - id: context-lens
      name: '@khorsheed/dsh-context-lens'
