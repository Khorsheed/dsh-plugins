# The dsh-local-agent-codex bundle patch: delegate dsh agents to the local
# Codex CLI under a scoped CODEX_HOME, and surface its session records. The
# family core row (`local-agent`, shared scoped-homes root) ships in the
# framework bundle @khorsheed/dsh-local-agent's own patch, which this bundle
# declares as a dependency — so installing this bundle alone still mounts the
# core, and no two patches insert the same row id.
#
# Two rows are inserted:
#   - local-agent-codex: this bundle's plugin registers the `codex` harness
#     (CODEX_HOME scoped home, `codex login --device-auth`, rollout-file
#     session records).
#   - tool-subagent-codex-local: the family-owned delegation tool (schema
#     description/prompt plus optional resume) over the `codex-local`
#     provider. The toolName is `subagent_codex` — the family takes the
#     model-facing name: the official preset row of that name ships
#     `disabled: true`, and this patch disables it too (below) so a community
#     install can never register two `subagent_codex` tools. A user who
#     deliberately re-enables the official row in their own preset layer gets
#     a loud duplicate-name conflict — by design, they must choose one. The
#     family tool adds continuation: a later round may pass the dsh child
#     session id returned by the first delegation to continue the same codex
#     thread.
#
# The tool mounts at the profile root, so every agent preset can delegate
# without per-preset variants. The provider starts no codex process until a
# tool call or /codex login.

- id: tool-subagent-codex
  disabled: true

- insert:
    - id: local-agent-codex
      name: '@khorsheed/dsh-local-agent-codex'

    - id: tool-subagent-codex-local
      name: '@khorsheed/dsh-local-agent-tool-subagent'
      config:
        provider: codex-local
        toolName: subagent_codex
