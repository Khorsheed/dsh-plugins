# The dsh-local-agent-codex bundle patch: delegate dsh agents to the local
# Codex CLI under a scoped CODEX_HOME, and surface its session records. The
# family core row (`local-agent`, shared scoped-homes root) lives in the
# framework bundle @khorsheed/dsh-local-agent's own patch. This bundle declares
# that package as an npm dependency, which makes the core's module resolvable —
# it does NOT mount the core row: `dsh plugin add` reconciles only the
# profile's direct dependencies, so the core must be installed explicitly
# alongside this bundle, or this provider stays pending. No other patch inserts
# the core row id.
#
# Exactly ONE row is inserted: the provider (this bundle's plugin registers the
# `codex` harness — CODEX_HOME scoped home, `codex login --device-auth`,
# rollout-file session records). The `subagent_codex` delegation tool is no
# longer a profile-root row: since the family fold it ships as this package's
# `./tool` composition entry (`name: '@khorsheed/dsh-local-agent-codex/tool'`
# in an agent preset), granted per session — the dev preset's
# `tool-subagent-codex-local` row is the grant point. The family keeps the
# official model-facing name `subagent_codex`: the official preset row of that
# name ships `disabled: true`, and this patch disables the profile-root row
# too (below) so a community install can never register two `subagent_codex`
# tools. A user who deliberately re-enables the official row in their own
# preset layer gets a loud duplicate-name conflict — by design, they must
# choose one. The family tool keeps its continuation parameter: a later round
# may pass the dsh child session id returned by the first delegation to
# continue the same codex thread.
#
# The provider starts no codex process until a tool call or /codex login.

- id: tool-subagent-codex
  disabled: true

- insert:
    - id: local-agent-codex
      name: '@khorsheed/dsh-local-agent-codex'
