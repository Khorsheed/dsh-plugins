# dsh-reader bundle patch: inserts the plugin row into the composing profile,
# so `dsh plugin --profile <name> add @khorsheed/dsh-reader` reconciles it into
# the bundles layer. The row is a bare mount — the host half provides the
# `reader` service core and mounts its thin Remote face; the browser half is
# discovered through the package.json `dsh.client` block.
#
# NOTE: a composition must mount this row id exactly once. Official images
# mount no reader row, so plugin-adding this package is the install path there;
# a composition that already mounts the id by other means must NOT also add it
# — a duplicate loader entry id fails boot.
#
# The second row mounts the `./tool` composition entry: the model-facing
# reader_read tool, live for EVERY session for now (the 2026-10-19 decision —
# a later pass may move the grant into the learning / writing presets). It
# delegates to the first row's services and registers nothing without them.
- insert:
    - id: reader
      name: "@khorsheed/dsh-reader"
    - id: reader-tool
      name: "@khorsheed/dsh-reader/tool"
