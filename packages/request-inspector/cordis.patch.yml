# dsh-request-inspector bundle patch: inserts the plugin row into the composing
# profile, so `dsh plugin --profile <name> add @khorsheed/dsh-request-inspector`
# reconciles it into the bundles layer. The row is a bare mount — the host half
# captures per-call request snapshots and mounts its Remote face; the browser
# half mounts the Remote contribution and the panel surfaces.
#
# NOTE: a composition must mount this row id exactly once. Official images
# mount no request-inspector row, so plugin-adding this package is the install
# path there; a composition that already mounts the id by other means must NOT
# also add it — a duplicate loader entry id fails boot.
- insert:
    - id: request-inspector
      name: "@khorsheed/dsh-request-inspector"
