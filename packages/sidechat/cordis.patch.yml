# sidechat bundle patch: inserts the plugin row into the composing profile, so
# `dsh plugin --profile <name> add @khorsheed/dsh-sidechat` reconciles it into
# the bundles layer. The row is a bare mount — the host half provides the
# `sideChat` service and mounts its Remote face; the browser half is
# discovered through the package.json `dsh.client` block.
#
# NOTE: a composition must mount this row id exactly once. Official images
# mount no sidechat row, so plugin-adding this package is the install path
# there; a composition that already mounts the id by other means must NOT also
# add it — a duplicate loader entry id fails boot.
- insert:
    - id: sidechat
      name: "@khorsheed/dsh-sidechat"
