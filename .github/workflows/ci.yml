name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The harness checkout seeds dev-time type/test resolution and typert
      # generation (AGENTS.md build contract). Pinned to the STABLE line the
      # repo currently tracks (see dsh.compat / the rc adaptation notes);
      # bump deliberately when the host line moves — the pin, the packages'
      # dsh.compat fields and the prod (3080) host move in one migration
      # (docs/host-migration-playbook). The alpha-compat job below covers the
      # line we are adapting to.
      - name: Clone deepseek-harness (type/test seed)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.2.1-rc.3
          path: deepseek-harness
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (harness seed)
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      # Host + client: client faces resolve against the harness's client type
      # libs, so a host-only seed is not enough.
      - name: Build harness libs (type seed)
        working-directory: deepseek-harness
        run: pnpm run build:lib

      # The host's session-persistence-jsonl flocks its journal through a
      # native addon (@deepseek-ai/node-addon-system-<platform>), whose .node
      # binaries are NOT in the harness git tree — they are compiled by this
      # script. Without it, require.resolve finds the package manifest but
      # bin/ is empty, and packages/room's journal persistence tests (which
      # run on the host persistence layer) fail on this Linux runner.
      # --host-addon-only compiles only this runner's flock addon with cc +
      # the setup-node headers; no musl/cross toolchain is involved.
      - name: Build harness native addon (flock)
        working-directory: deepseek-harness
        run: pnpm run build:native-system

      - name: Install (repo)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          DSH_HARNESS: ${{ github.workspace }}/deepseek-harness

      - name: Test
        run: pnpm run test
        env:
          DSH_HARNESS: ${{ github.workspace }}/deepseek-harness

      # Packing is where artifact-level regressions surface (dropped globs,
      # missing hashed chunks, lost family edges) — pack every bundle package
      # so they fail here, not on a prod boot.
      - name: Pack all bundles (artifact verification)
        run: pnpm exec tsx scripts/pack-all-dist.ts

      - name: Repo hygiene (full tree)
        run: pnpm check:hygiene --all

      - name: Plugin independence
        run: pnpm check:plugins

      - name: Script tests (checkers' own specs)
        run: pnpm run test:scripts

      - name: Suite mirror check (dsh-basic)
        run: pnpm run sync:mirror package basic --check

      - name: Doc gates
        run: |
          pnpm run verify-agent-note-format
          pnpm run verify-agent-note-classification
          pnpm run verify-translation-pairing

  # The stable line above gates merges. This one reports: it builds and tests
  # the same tree against the host's FORWARD line (the `next` dist-tag — the
  # rc of the upcoming release), so a package that only works on one line is
  # visible before the eventual baseline migration instead of during it.
  # (We track `next`, not `alpha`: during the 0.1.5 wave the alpha tag rotted
  # at 0.1.5-alpha.2 while rc.1/rc.2 shipped through next/latest — a lane
  # pinned to a stale tag stops meaning anything.)
  #
  # Deliberately non-blocking. Upstream can turn this red at any time for
  # reasons that are not ours. A required check somebody else controls is one
  # people learn to ignore — and an ignored gate protects nothing.
  next-compat:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Track whatever the next dist-tag points at rather than pinning a
      # version here: a pinned forward line rots within days, and a job
      # testing a host nobody is adapting to any more quietly stops meaning
      # anything. The harness tags its releases `dsh-v<npm version>`.
      # npm can carry a version before its git tag reaches GitHub (0.2.1-rc.4,
      # 2026-10-26: on npm for hours, no tag). Without source there is no
      # forward host to test, so the remaining steps skip with a notice
      # instead of failing the clone.
      - name: Resolve the forward host
        id: next
        run: |
          version=$(npm view @deepseek-ai/dsh dist-tags.next)
          echo "ref=dsh-v${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags https://github.com/deepseek-ai/deepseek-harness "refs/tags/dsh-v${version}" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "tracking forward host ${version}"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::forward host ${version} is on npm but dsh-v${version} is not on GitHub yet; skipping the forward lane"
          fi

      - name: Clone deepseek-harness (forward line)
        if: steps.next.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.next.outputs.ref }}
          path: deepseek-harness
          fetch-depth: 1

      - name: Install (harness seed)
        if: steps.next.outputs.ready == 'true'
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Build harness libs (type seed)
        if: steps.next.outputs.ready == 'true'
        working-directory: deepseek-harness
        run: pnpm run build:lib

      # Same native-addon seed as the gates job: the host's journal flock
      # needs the compiled .node binary, which is not in the harness git tree.
      - name: Build harness native addon (flock)
        if: steps.next.outputs.ready == 'true'
        working-directory: deepseek-harness
        run: pnpm run build:native-system

      - name: Install (repo)
        if: steps.next.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # Only the harness-sensitive steps run here. Hygiene, plugin
      # independence, the doc gates and the mirror check never read the
      # harness, so repeating them would double the cost for no new signal.
      - name: Build (forward host)
        if: steps.next.outputs.ready == 'true'
        run: pnpm run build
        env:
          DSH_HARNESS: ${{ github.workspace }}/deepseek-harness

      - name: Test (forward host)
        if: steps.next.outputs.ready == 'true'
        run: pnpm run test
        env:
          DSH_HARNESS: ${{ github.workspace }}/deepseek-harness
