name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The harness checkout seeds dev-time type/test resolution and typert
      # generation (AGENTS.md build contract). Pinned to the STABLE line the
      # repo currently tracks (see dsh.compat / the rc adaptation notes);
      # bump deliberately when the host line moves. The alpha-compat job
      # below covers the line we are adapting to.
      - name: Clone deepseek-harness (type/test seed)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.2-rc.1
          path: deepseek-harness
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (harness seed)
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      # Host + client: client faces resolve against the harness's client type
      # libs, so a host-only seed is not enough.
      - name: Build harness libs (type seed)
        working-directory: deepseek-harness
        run: pnpm run build:lib

      - name: Install (repo)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          DSH_HARNESS: ${{ github.workspace }}/deepseek-harness

      - name: Test
        run: pnpm run test
        env:
          DSH_HARNESS: ${{ github.workspace }}/deepseek-harness

      # Packing is where artifact-level regressions surface (dropped globs,
      # missing hashed chunks, lost family edges) — pack every bundle package
      # so they fail here, not on a prod boot.
      - name: Pack all bundles (artifact verification)
        run: pnpm exec tsx scripts/pack-all-dist.ts

      - name: Repo hygiene (full tree)
        run: pnpm check:hygiene --all

      - name: Plugin independence
        run: pnpm check:plugins

      - name: Script tests (checkers' own specs)
        run: pnpm run test:scripts

      - name: Profile mirror check
        run: pnpm run sync:profile web-basic --check

      - name: Doc gates
        run: |
          pnpm run verify-agent-note-format
          pnpm run verify-agent-note-classification
          pnpm run verify-translation-pairing

  # The stable line above gates merges. This one reports: it builds and tests
  # the same tree against the host line we are adapting TO, so a package that
  # only works on one line is visible before the eventual baseline migration
  # instead of during it.
  #
  # Deliberately non-blocking. The alpha line shipped alpha.1 through alpha.4
  # inside a week, so upstream can turn this red at any time for reasons that
  # are not ours. A required check somebody else controls is one people learn
  # to ignore — and an ignored gate protects nothing.
  alpha-compat:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Track whatever the alpha dist-tag points at rather than pinning a
      # version here: a pinned alpha rots within days, and a job testing a
      # host nobody is adapting to any more quietly stops meaning anything.
      # The harness tags its releases `dsh-v<npm version>`.
      - name: Resolve the current alpha host
        id: alpha
        run: |
          version=$(npm view @deepseek-ai/dsh dist-tags.alpha)
          echo "ref=dsh-v${version}" >> "$GITHUB_OUTPUT"
          echo "tracking alpha host ${version}"

      - name: Clone deepseek-harness (alpha line)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.alpha.outputs.ref }}
          path: deepseek-harness
          fetch-depth: 1

      - name: Install (harness seed)
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Build harness libs (type seed)
        working-directory: deepseek-harness
        run: pnpm run build:lib

      - name: Install (repo)
        run: pnpm install --frozen-lockfile

      # Only the harness-sensitive steps run here. Hygiene, plugin
      # independence, the doc gates and the mirror check never read the
      # harness, so repeating them would double the cost for no new signal.
      - name: Build (alpha host)
        run: pnpm run build
        env:
          DSH_HARNESS: ${{ github.workspace }}/deepseek-harness

      - name: Test (alpha host)
        run: pnpm run test
        env:
          DSH_HARNESS: ${{ github.workspace }}/deepseek-harness
