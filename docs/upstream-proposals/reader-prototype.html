<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  /* 宿主 token 解析值（ui-theme/src/styles/design-platform.css，light）。
     实现时必须写 token 名，映射表见 2026-09-17-reader-prototype-notes.md */
  :root{
    --bg:rgb(255,255,255); --bg-plat:rgb(245,246,247); --bg-active:rgb(235,238,242); --bg-tile:rgb(225,229,238);
    --fg:rgb(15,17,21); --fg-2:rgb(97,102,107); --fg-3:rgb(129,133,140); --fg-4:rgb(173,178,184);
    --line-1:rgba(0,0,0,.04); --line-2:rgba(0,0,0,.10); --line-3:rgba(0,0,0,.12);
    --hover:rgba(38,49,72,.06); --active:rgba(38,49,72,.10);
    --accent:rgb(65,118,230); --warn:rgb(245,158,11);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:transparent;color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
  .panel{position:relative;display:flex;flex-direction:column;width:380px;height:626px;background:var(--bg);
    border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
  .ib{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;
    border:0;border-radius:50%;background:transparent;color:var(--fg-2);cursor:pointer}
  .ib:hover{background:var(--hover);color:var(--fg)}
  .ib:active{background:var(--active)}
  .ib.on{background:var(--bg-active);color:var(--fg)}
  .lb{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:var(--bg);color:var(--fg);
    font-family:var(--font);font-size:11px;line-height:1;padding:5px 9px;border-radius:7px;cursor:pointer}
  .lb:hover{background:var(--hover)}

  .head{flex:none;display:flex;align-items:center;gap:2px;padding:8px 8px 8px 10px;border-bottom:1px solid var(--line-2)}
  .head .t{flex:1;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
  .head .n{font-size:10.5px;font-weight:400;color:var(--fg-3)}
  .bar{flex:none;display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line-2)}
  .bar .sp{flex:1}
  .bar .lbl{font-size:10.5px;color:var(--fg-3);padding:0 4px}

  /* 工具条：搜索 + 只看未读 + 排序 */
  .tools{flex:none;display:flex;align-items:center;gap:5px;padding:8px 10px 6px}
  .sbox{flex:1;min-width:0;position:relative}
  .sbox svg{position:absolute;left:7px;top:50%;transform:translateY(-50%);color:var(--fg-4);pointer-events:none}
  .sbox input{width:100%;height:26px;padding:0 8px 0 26px;font-family:var(--font);font-size:11.5px;color:var(--fg);
    background:var(--bg);border:1px solid var(--line-2);border-radius:7px;outline:none}
  .sbox input::placeholder{color:var(--fg-4)}
  .sbox input:focus{border-color:var(--accent)}

  .scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 8px 10px}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:rgb(229,229,229);border-radius:4px}
  .card{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 9px;padding:8px 8px 8px 9px;
    border:1px solid transparent;border-radius:10px;cursor:pointer}
  .card:hover{background:var(--hover)}
  .card:active{background:var(--active)}
  .tile{grid-row:1/span 3;grid-column:1;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;
    font-size:10.5px;font-weight:700;color:#fff}
  .meta{grid-column:2;display:flex;align-items:baseline;gap:6px;min-width:0}
  .src{font-size:10.5px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .when{font-size:10.5px;color:var(--fg-3);flex:none;font-variant-numeric:tabular-nums}
  .sep{color:var(--fg-4);font-size:10.5px;flex:none}
  .ttl{grid-column:2/-1;display:flex;align-items:flex-start;gap:6px;min-width:0}
  .ttl .h{font-size:12.5px;line-height:17px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ttl .u{flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:6px}
  .sum{grid-column:2/-1;margin-top:3px;font-size:11.5px;line-height:16px;color:var(--fg-2);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ctags{grid-column:2/-1;display:flex;gap:4px;align-items:center;margin-top:5px}
  .tag{flex:none;font-size:10px;line-height:1;color:var(--fg-3);background:var(--bg-active);padding:3px 6px;border-radius:5px}
  .author{font-size:10px;color:var(--fg-4)}
  .cv{grid-column:3;grid-row:1;margin-top:2px;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
    border-radius:6px;color:var(--fg-4)}
  .card:hover .cv{background:var(--bg-active);color:var(--fg-2)}
  .ghead{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--fg-3);padding:10px 2px 4px}
  .none{font-size:11.5px;line-height:18px;color:var(--fg-3);padding:22px 8px}

  /* 新增源 */
  .add{display:none;flex:1;min-height:0;flex-direction:column;padding:12px 12px 0}
  .add.show{display:flex}
  .add h2{margin:0 0 4px;font-size:13.5px;font-weight:700}
  .add p{margin:0 0 12px;font-size:11px;line-height:17px;color:var(--fg-3)}
  .add input{width:100%;height:30px;padding:0 9px;font-family:var(--font);font-size:12px;color:var(--fg);
    background:var(--bg);border:1px solid var(--line-2);border-radius:8px;outline:none;margin-bottom:8px}
  .add input:focus{border-color:var(--accent)}
  .add .go{align-self:flex-start;border:0;background:var(--fg);color:var(--bg);font-family:var(--font);font-size:11.5px;
    padding:7px 13px;border-radius:8px;cursor:pointer}
  .add .go:hover{opacity:.88}
  .verdict{display:none;margin-top:12px;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--bg-plat);
    font-size:11px;line-height:17px;color:var(--fg-2)}
  .verdict.show{display:block}
  .verdict b{color:var(--fg)}

  /* 详情页 */
  .detail{display:none;flex:1;min-height:0;flex-direction:column}
  .detail.show{display:flex}
  .dbody{flex:1;min-height:0;overflow-y:auto;padding:0 14px 22px}
  .dbody::-webkit-scrollbar{width:8px}
  .dbody::-webkit-scrollbar-thumb{background:rgb(229,229,229);border-radius:4px}
  .kicker{display:flex;align-items:center;gap:6px;margin:14px 0 8px;font-size:10.5px;color:var(--fg-3)}
  .kicker .tile{width:16px;height:16px;border-radius:4px;font-size:9px;grid-row:auto;grid-column:auto}
  h1{font-size:17px;line-height:1.4;font-weight:700;letter-spacing:-.005em;margin:0 0 9px}
  .tagrow{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
  .rule{height:1px;background:var(--line-2);margin:0 0 16px}
  .art{color:var(--fg-2)}
  .art[lang="zh"]{font-size:13.5px;line-height:1.78;letter-spacing:.005em}
  .art[lang="en"]{font-size:13.5px;line-height:1.66;letter-spacing:-.003em}
  .art p{margin:0 0 12px}
  .art[lang="en"] p{max-width:62ch}
  .art[lang="zh"] p{max-width:40em}
  .art h2{margin:24px 0 9px;font-size:15px;line-height:1.45;font-weight:700;color:var(--fg)}
  .art blockquote{margin:0 0 12px;padding:2px 0 2px 11px;border-left:3px solid var(--line-3)}
  .art a{color:var(--accent);text-decoration:none}
  .art a:hover{text-decoration:underline;text-underline-offset:2px}
  .art strong{font-weight:650;color:var(--fg)}
  /* 完整性说明：一行，不是一块卡片 */
  .cut{margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line-2);font-size:11px;line-height:17px;color:var(--fg-3)}
  .cut a{color:var(--accent);text-decoration:none;cursor:pointer}
  .cut a:hover{text-decoration:underline;text-underline-offset:2px}
  .next{margin-top:22px}
  .next .lbl{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--fg-3);margin-bottom:6px}
  .nextrow{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line-1);font-size:11.5px;color:var(--fg-2);cursor:pointer}
  .nextrow:hover{color:var(--fg)}
  .nextrow .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nextrow .w{flex:none;font-size:10.5px;color:var(--fg-4)}

  .composer{flex:none;border-top:1px solid var(--line-2);background:var(--bg-plat);padding:7px 10px}
  .composer .lbl{font-size:10px;color:var(--fg-3);margin-bottom:4px}
  .composer .txt{font-size:11px;line-height:16px;color:var(--fg-2);white-space:pre-wrap;word-break:break-word;max-height:50px;overflow-y:auto}
  .composer .txt.ph{color:var(--fg-4)}
  .foot{flex:none;display:flex;gap:6px;align-items:center;padding:6px 10px;border-top:1px solid var(--line-2);
    background:var(--bg-plat);font-size:10.5px;color:var(--fg-3)}

  /* quote 插件的选区菜单：这是**它自己的 UI**，本插件不自造（D13） */
  .qmenu{position:absolute;display:none;z-index:9}
  .qmenu.show{display:block}
  .qmenu .box{display:flex;gap:2px;padding:3px;border-radius:9px;background:rgb(33,33,35);box-shadow:0 4px 14px rgba(0,0,0,.24)}
  .qmenu button{border:0;background:transparent;color:#fff;font-family:var(--font);font-size:11px;padding:4px 8px;
    border-radius:6px;cursor:pointer;white-space:nowrap}
  .qmenu button:hover{background:rgba(255,255,255,.16)}

  .menu{position:absolute;display:none;z-index:20;background:var(--bg);border:1px solid var(--line-2);border-radius:9px;
    box-shadow:0 6px 20px rgba(0,0,0,.12);padding:4px;min-width:150px}
  .menu.show{display:block}
  .menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;background:transparent;
    color:var(--fg);font-family:var(--font);font-size:11.5px;padding:6px 8px;border-radius:6px;cursor:pointer;text-align:left}
  .menu button:hover{background:var(--hover)}
  .menu .ck{color:var(--accent)}
  .tip{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:rgb(33,33,35);color:#fff;font-size:11px;
    padding:5px 10px;border-radius:999px;font-family:var(--font);pointer-events:none;opacity:0;transition:opacity .16s;z-index:99;white-space:nowrap}
  .tip.show{opacity:1}
  .seg{display:inline-flex;padding:2px;border-radius:999px;background:var(--bg-active)}
  .seg button{border:0;background:transparent;color:var(--fg-2);font-family:var(--font);font-size:11.5px;line-height:1;
    padding:5px 10px;border-radius:999px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:600}
  .hint{font-size:10.5px;line-height:18px;color:var(--fg-3)}
  .hint b{color:var(--fg);font-weight:600}
</style>
</head>
<body>
<div class="row">
  <div class="panel" id="panel">
    <div class="head" id="head">
      <span class="t"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" id="globe"></svg><span>阅读</span><span class="n" id="unreadN">0 未读</span></span>
      <button class="ib" id="refresh" title="刷新全部"></button>
      <button class="ib" id="addBtn" title="新增订阅源或链接"></button>
    </div>

    <div class="tools" id="tools">
      <div class="sbox"><span id="searchIcon"></span><input id="search" placeholder="搜索标题、作者、来源…"></div>
      <button class="ib" id="unreadOnly" title="只看未读"></button>
      <button class="ib" id="sortBtn" title="排序"></button>
    </div>

    <div class="scroll" id="scroll"></div>

    <div class="add" id="addPane">
      <h2>新增</h2>
      <p>粘贴订阅源地址或任意文章链接。抓回来是什么，就按什么处理：是 feed 就订阅，是网页就只存这一篇。</p>
      <input id="url" placeholder="https://">
      <button class="go" id="submit">抓取</button>
      <div class="verdict" id="verdict"></div>
    </div>

    <div class="detail" id="detail">
      <div class="bar" id="dbar">
        <button class="ib" id="back" title="返回列表"></button>
        <span class="lbl">条目详情</span><span class="sp"></span>
        <button class="ib" id="copy" title="复制链接"></button>
        <button class="ib" id="open" title="在浏览器打开原文"></button>
      </div>
      <div class="dbody" id="dbody"></div>
    </div>

    <div class="composer" id="composer" style="display:none">
      <div class="lbl">当前会话草稿</div>
      <div class="txt ph" id="draft">（空）</div>
    </div>
    <div class="foot" id="foot"><span>刷出于 2 小时前 · 每日 10:00 自动刷新</span></div>

    <div class="qmenu" id="qmenu"><div class="box"><button data-q="conv">引用到当前会话</button><button data-q="copy">复制</button></div></div>
    <div class="menu" id="sortMenu"></div>
  </div>

  <div style="width:262px;padding-top:2px">
    <div class="seg" style="margin-bottom:10px">
      <button id="tabList" aria-pressed="true">列表</button>
      <button id="tabAdd" aria-pressed="false">新增</button>
      <button id="tabDetail" aria-pressed="false">详情</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</div>
<div class="tip" id="tip"></div>

function placeMenu(){
  var t=selInArt();if(!t){qmenu.classList.remove('show');return}
  var r=window.getSelection().getRangeAt(0).getBoundingClientRect(),pr=panel.getBoundingClientRect();
  var w=qmenu.offsetWidth||186;
  qmenu.style.left=Math.max(6,Math.min(r.left+r.width/2-pr.left-w/2,panel.offsetWidth-w-6))+'px';
  qmenu.style.top=Math.max(6,(r.top-pr.top)-38)+'px';
  qmenu.classList.add('show');
}
document.addEventListener('selectionchange',function(){if(st.openId!==null)placeMenu()});
dbody.addEventListener('scroll',function(){if(st.openId!==null)setTimeout(placeMenu,0)});
qmenu.addEventListener('mousedown',function(ev){ev.preventDefault()});
qmenu.querySelectorAll('[data-q]').forEach(function(b){
  b.addEventListener('click',function(){
    var e=byId(st.openId);
    if(b.getAttribute('data-q')==='copy'){flash('已复制选中内容')}
    else{
      var sel=selInArt()||(e?e.sum:'');
      var block='> '+sel+'\n\n— 《'+(e?e.title:'')+'》'+(e?e.src:'');
      var wasPh=draft.classList.contains('ph');draft.classList.remove('ph');
      draft.textContent=(wasPh?'':draft.textContent+'\n\n')+block;
      flash('已引用 '+sel.length+' 字');
    }
    qmenu.classList.remove('show');
    var s=window.getSelection();if(s)s.removeAllRanges();
  });
});
var HINTS={
 list:'<b>列表页</b>的新东西：搜索框（本地过滤标题/摘要/作者/来源）、<b>只看未读</b>、<b>排序</b>（最新 / 最早 / 按来源分组）、右上 <b>+</b> 新增。未读改成标题前的<b>圆点</b>。<br><br>点任意卡片看详情。',
 add:'<b>新增</b>：一个输入框，<b>抓回来是什么就按什么处理</b> —— 是 feed 就订阅，是网页就只存这一篇。这样你不用先回答"这地址到底是不是 RSS"，也不会因为粘了一个网页首页而建出一个 0 条的假订阅源。<br><br>试试点「抓取」，看两种判定结果。',
 detail:'<b>详情页</b>。正文里划选 → quote 插件的选区菜单（它就是那个 UI，本插件不自造）。<br><br>滚到底看 <b>受限篇幅</b> 那一行 —— 按你的要求改成一行文字 + 可点的「阅读原文」，不再是整块提示卡。'
};
function setTab(which){
  document.getElementById('tabList').setAttribute('aria-pressed',String(which==='list'));
  document.getElementById('tabAdd').setAttribute('aria-pressed',String(which==='add'));
  document.getElementById('tabDetail').setAttribute('aria-pressed',String(which==='detail'));
  document.getElementById('hint').innerHTML=HINTS[which];
  if(which==='list')showList();else if(which==='add')showAdd();else showDetail('e2');
}
document.getElementById('tabList').addEventListener('click',function(){setTab('list')});
document.getElementById('tabAdd').addEventListener('click',function(){setTab('add')});
document.getElementById('tabDetail').addEventListener('click',function(){setTab('detail')});
renderList();
setTab('list');
</script>
