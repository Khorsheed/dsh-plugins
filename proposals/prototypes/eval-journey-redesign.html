<title>评测旅程走查稿</title>
<style>
/* 取值与 3171 宿主 --dsw-alias-* 一致（09-23 实测），名字也沿用，实施时直接换成 var(--dsw-alias-…) */
:root{
  --bg-base:#fff; --bg-side:#f8f9fa; --bg-l2:#f6f7f9; --overlay:#e9ecf2;
  --b1:#0000000a; --b2:#0000001a; --b3:#0000001f; --b4:#00000029;
  --l1:#0f1115; --l2:#61666b; --l3:#81858c; --cap:#adb2b8;
  --pri:#0f1115; --pri-ink:#fff; --pri-hover:#43454a; --dim:#ebeef2;
  --link:#4176e6; --biz:#4176e6; --biz-3:#e4edfd;
  --hover:#2631480f; --active:#2631481a;
  --ok:#22c55e; --ok-ink:#16a34a; --ok-3:#e6faed;
  --warn:#f59e0b; --warn-ink:#dd8629; --warn-3:#fef5e7;
  --err:#ec1313; --err-3:#ec13130d; --diffbg:#fef5e7;
  --add:#e6faed; --del:#ec13130d;
  --note-ink:#0f1115;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg-base:#151517; --bg-side:#1b1b1d; --bg-l2:#232324; --overlay:#61666b;
  --b1:#ffffff0f; --b2:#ffffff1f; --b3:#ffffff29; --b4:#fff3;
  --l1:#f9fafb; --l2:#cfd3d6; --l3:#adb2b8; --cap:#81858c;
  --pri:#f9fafb; --pri-ink:#0f1115; --pri-hover:#ebeef2; --dim:#43454a;
  --link:#679efe; --biz:#679efe; --biz-3:#34415b;
  --hover:#ffffff14; --active:#ffffff24;
  --ok:#22c55e; --ok-ink:#4ed17e; --ok-3:#233c2c;
  --warn:#f59e0b; --warn-ink:#f7ad31; --warn-3:#27241f;
  --err:#f25a5a; --err-3:#f25a5a26; --diffbg:#27241f;
  --add:#233c2c; --del:#f25a5a26; --note-ink:#f9fafb;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg-base:#151517; --bg-side:#1b1b1d; --bg-l2:#232324; --overlay:#61666b;
  --b1:#ffffff0f; --b2:#ffffff1f; --b3:#ffffff29; --b4:#fff3;
  --l1:#f9fafb; --l2:#cfd3d6; --l3:#adb2b8; --cap:#81858c;
  --pri:#f9fafb; --pri-ink:#0f1115; --pri-hover:#ebeef2; --dim:#43454a;
  --link:#679efe; --biz:#679efe; --biz-3:#34415b;
  --hover:#ffffff14; --active:#ffffff24;
  --ok:#22c55e; --ok-ink:#4ed17e; --ok-3:#233c2c;
  --warn:#f59e0b; --warn-ink:#f7ad31; --warn-3:#27241f;
  --err:#f25a5a; --err-3:#f25a5a26; --diffbg:#27241f;
  --add:#233c2c; --del:#f25a5a26; --note-ink:#f9fafb;
}
*{box-sizing:border-box}
body{background:var(--bg-side);color:var(--l1);font-family:var(--sans);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:0 48px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1440px;margin:0 auto}
.mono{font-family:var(--mono);font-size:12px}
.c2{color:var(--l2)} .c3{color:var(--l3)} .sm{font-size:12px}
header.top{padding-block:24px 16px;display:flex;flex-wrap:wrap;gap:10px 32px;align-items:flex-end;justify-content:space-between}
header.top h1{font-size:20px;margin:0;font-weight:600;text-wrap:balance}
header.top p{margin:4px 0 0;color:var(--l2);max-width:72ch}
.legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--l2);font-size:12px;align-items:center}
.layout{display:grid;grid-template-columns:188px minmax(0,1fr);gap:20px;align-items:start}

/* storyboard nav：学宿主侧栏的会话列表 */
nav.scenes{position:sticky;top:env(safe-area-inset-top,0px);padding-top:4px;display:flex;flex-direction:column;gap:1px}
nav.scenes .grp{font-size:12px;color:var(--l3);margin:14px 10px 4px}
nav.scenes button{all:unset;cursor:pointer;padding:6px 10px;border-radius:8px;color:var(--l1);display:flex;gap:8px;align-items:baseline;font-size:14px}
nav.scenes button b{font-weight:400;color:var(--cap);font-variant-numeric:tabular-nums;min-width:1.3em;font-size:12px}
nav.scenes button .new{font-size:11px;color:var(--biz);margin-left:auto}
nav.scenes button:hover{background:var(--hover)}
nav.scenes button[aria-current="true"]{background:var(--active)}
nav.scenes button:focus-visible{outline:2px solid var(--biz)}

.scene{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:20px;align-items:start}
.scene-title{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.scene-title h2{margin:0;font-size:16px;font-weight:600}
.scene-title .who{font-size:12px;color:var(--l3)}
.scene-title p{flex-basis:100%;margin:0;color:var(--l2);max-width:84ch}
.pager{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px}
.pager button{all:unset;cursor:pointer;color:var(--link);font-size:13px}
.full{grid-column:1/-1}

/* ---------- 宿主外壳 ---------- */
.app{background:var(--bg-base);border:1px solid var(--b2);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:200px minmax(0,1fr);min-height:560px}
.side{background:var(--bg-side);border-right:1px solid var(--b2);padding:12px 8px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.side .logo{font-weight:700;letter-spacing:-.01em;padding:2px 6px 10px;display:flex;align-items:center;gap:6px}
.side .logo small{font-size:9px;background:var(--pri);color:var(--pri-ink);padding:0 4px;border-radius:2px;letter-spacing:.06em}
.side .newbtn{border:1px solid var(--b2);border-radius:10px;background:var(--bg-base);text-align:center;padding:5px;margin-bottom:10px}
.side .h{color:var(--l3);padding:4px 6px}
.side .ws{padding:4px 6px}
.side .ss{padding:4px 6px 4px 22px;border-radius:8px;display:flex;justify-content:space-between;color:var(--l1);white-space:nowrap;overflow:hidden}
.side .ss span:last-child{color:var(--l3);font-size:12px}
.side .ss.on{background:var(--active)}
.main{display:flex;flex-direction:column;min-width:0}
.hd{display:flex;align-items:center;gap:10px;padding:10px 20px 0;flex-wrap:wrap}
.hd .ttl{font-weight:500;font-size:14px}
.hd .mode{font-size:12px;color:var(--l2)}
.xchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--b2);border-radius:999px;padding:1px 8px;color:var(--l1);background:var(--bg-base)}
.xchip i{width:6px;height:6px;border-radius:50%;background:var(--l3);display:inline-block}
.xchip.run i{background:var(--biz)} .xchip.ok i{background:var(--ok)} .xchip.warn i{background:var(--warn)}
.xchip .cv{color:var(--l3)}
.tabs{display:flex;gap:28px;padding:6px 20px 0;border-bottom:1px solid var(--b2);overflow-x:auto;font-size:13px}
.tabs span{padding:6px 0 8px;color:var(--l2);white-space:nowrap}
.tabs span.on{color:var(--biz);box-shadow:inset 0 -2px 0 var(--biz)}
.tabs .tn{display:inline-block;min-width:16px;height:16px;margin-left:4px;padding:0 4px;border-radius:8px;background:var(--warn-3);color:var(--warn-ink);font-size:11px;line-height:16px;text-align:center;font-style:normal}
.hmark{margin:0 0 10px;padding:8px 12px;border-left:3px solid var(--warn);background:var(--warn-3);border-radius:0 6px 6px 0;font-size:13px;color:var(--l1)}
.hmark .w2{display:block;color:var(--l3);font-size:12px;margin-top:2px}
.body{padding:14px 20px 18px;flex:1}
.body.chat{padding:20px clamp(12px,6%,64px) 8px}

/* 输入框 & 提问卡（宿主 QuestionComposer 替代输入框） */
.composer{margin:8px clamp(12px,6%,64px) 16px;border:1px solid var(--b2);border-radius:16px;padding:10px 12px 8px;background:var(--bg-base);box-shadow:0 1px 2px var(--b1)}
.composer .txt{color:var(--cap);min-height:22px}
.composer .txt.filled{color:var(--l1)}
.composer .row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:12px;color:var(--l2)}
.composer .send{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--biz);opacity:.45}
.composer .send.on{opacity:1}
.composer .ic{width:24px;height:24px;border-radius:50%;border:1px solid var(--b2);display:inline-grid;place-items:center;color:var(--l2)}
.refchip{display:inline-flex;gap:5px;align-items:center;font-size:12px;background:var(--bg-l2);border:1px solid var(--b2);border-radius:6px;padding:0 6px;color:var(--l1)}
.qcard{margin:8px clamp(12px,6%,64px) 16px;border:1px solid var(--b3);border-radius:16px;background:var(--bg-base);box-shadow:0 4px 18px -8px rgba(0,0,0,.18);overflow:hidden}
.qcard .qh{display:flex;align-items:center;gap:8px;padding:12px 14px 4px}
.qcard .eyebrow{font-size:12px;color:var(--l3)}
.qcard .badge{font-size:11px;border-radius:4px;padding:0 5px;background:var(--bg-l2);color:var(--l2);border:1px solid var(--b2)}
.qcard .qt{font-weight:500;padding:0 14px 8px}
.qopt{display:flex;gap:10px;padding:8px 14px;align-items:flex-start;border-top:1px solid var(--b1)}
.qopt .n{width:20px;height:20px;border-radius:6px;border:1px solid var(--b3);display:grid;place-items:center;font-size:11px;color:var(--l2);flex:none;margin-top:1px}
.qopt.sel{background:var(--hover)} .qopt.sel .n{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.qopt .lb{font-weight:500}
.qopt .ds{font-size:12px;color:var(--l2)}
.rec{font-size:11px;color:var(--biz);background:var(--biz-3);border-radius:4px;padding:0 5px;margin-left:6px;font-weight:400}
.qcard .custom{border-top:1px solid var(--b1);padding:8px 14px;color:var(--cap);display:flex;gap:10px}
.qcard .qf{border-top:1px solid var(--b2);display:flex;gap:10px;align-items:center;padding:8px 14px;font-size:12px;color:var(--l2)}

/* 对话 */
.u{margin-left:auto;max-width:76%;background:var(--bg-l2);padding:9px 14px;border-radius:16px;margin-bottom:16px;width:fit-content}
.a{margin-bottom:12px;max-width:94%}
.a p{margin:0 0 8px}
.trow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--l2);padding:4px 0;margin-bottom:4px}
.trow .tk{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ok);display:inline-grid;place-items:center;font-size:9px;color:var(--ok)}
.trow code{font-family:var(--mono);font-size:12px;color:var(--l1)}
.evt{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--l2);border:1px dashed var(--b3);border-radius:10px;padding:6px 10px;margin:4px 0 12px}

/* 通用件 */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:5px 12px;font-size:13px;border:1px solid var(--b2);background:var(--bg-base);color:var(--l1);white-space:nowrap}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.ghost{border-color:transparent;color:var(--link);padding-inline:2px;background:none}
.btn.dis{opacity:.4}
.btn.sm{padding:2px 9px;font-size:12px;border-radius:8px}
.btn.ai::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--biz);transform:rotate(45deg)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:0 7px;border-radius:6px;line-height:20px;white-space:nowrap;background:var(--bg-l2);color:var(--l2)}
.pill.ok{background:var(--ok-3);color:var(--ok-ink)} .pill.run{background:var(--biz-3);color:var(--biz)}
.pill.warn{background:var(--warn-3);color:var(--warn-ink)} .pill.bad{background:var(--err-3);color:var(--err)}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.box{border:1px solid var(--b2);border-radius:12px;background:var(--bg-base)}
.box > .bh{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--b2);flex-wrap:wrap}
.box > .bh h4{margin:0;font-size:13px;font-weight:600}
.box > .bb{padding:12px 14px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:13px;margin:0}
.kv dt{color:var(--l3)} .kv dd{margin:0}

/* 实验页 */
.xhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.xhead .back{color:var(--l3);font-size:12px}
.xhead h3{margin:0;font-size:15px;font-weight:600}
.xhead .q{flex-basis:100%;color:var(--l2);font-size:13px}
.stepper{display:flex;margin:2px 0 14px;overflow-x:auto;padding-bottom:2px}
.step{flex:1 1 0;min-width:80px;position:relative;padding-top:15px;font-size:12px;color:var(--l3)}
.step::before{content:"";position:absolute;top:4px;left:0;right:0;height:2px;background:var(--b2)}
.step::after{content:"";position:absolute;top:0;left:0;width:10px;height:10px;border-radius:50%;background:var(--bg-base);border:2px solid var(--b4)}
.step.done{color:var(--l2)} .step.done::before{background:var(--l1)} .step.done::after{background:var(--l1);border-color:var(--l1)}
.step.now{color:var(--l1);font-weight:600} .step.now::after{border-color:var(--biz);background:var(--biz);box-shadow:0 0 0 4px var(--biz-3)}
.step.flag{color:var(--warn-ink);font-weight:600} .step.flag::after{border-color:var(--warn);background:var(--warn)}
.step small{display:block;font-weight:400;color:var(--l3)}
.stages{display:flex;gap:4px;margin:0 0 12px;overflow-x:auto;border:1px solid var(--b2);border-radius:10px;padding:3px;width:fit-content;max-width:100%}
.stages span{padding:4px 12px;border-radius:7px;font-size:13px;color:var(--l2);white-space:nowrap}
.stages span.on{background:var(--active);color:var(--l1);font-weight:500}
.stages span .d{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--b4)}
.stages span .d.ok{background:var(--ok)} .stages span .d.run{background:var(--biz)} .stages span .d.warn{background:var(--warn)}
.next{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px;border-radius:12px;background:var(--bg-l2);margin-bottom:16px}
.next .say{flex:1 1 260px}
.next .say b{display:block;font-weight:600}
.next .say span{font-size:12px;color:var(--l2)}
.next.warnish{background:var(--warn-3)}
.sec{margin-bottom:16px}
.sec > h5{font-size:13px;color:var(--l1);margin:0 0 8px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec > h5 .h5s{font-weight:400;color:var(--l3);font-size:12px}
.fold{border-top:1px solid var(--b2);padding:9px 0;color:var(--l2);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fold::before{content:"›";color:var(--l3)}
.fold .n{margin-left:auto;font-size:12px;color:var(--l3)}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.t th{font-weight:400;color:var(--l3);text-align:left;font-size:12px;padding:6px 10px;border-bottom:1px solid var(--b2);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--b1);vertical-align:top}
table.t td.diff{background:var(--diffbg)}
table.t tr:last-child td{border-bottom:0}
.sub{font-size:11px;color:var(--l3);display:block}
.editable{border-bottom:1px dashed var(--b4)}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.cell{border:1px solid var(--b2);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:4px}
.cell.sel{border-color:var(--l1);box-shadow:0 0 0 1px var(--l1)}
.cell .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tl{list-style:none;margin:0;padding:0;font-size:12px}
.tl li{display:flex;gap:10px;padding:3px 0;color:var(--l2)}
.tl li i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--l1)}
.tl li.cur i{background:var(--biz);box-shadow:0 0 0 3px var(--biz-3)}
.tl li.todo i{background:var(--b4)}
.tl li span:last-child{margin-left:auto;color:var(--l3)}
.bars{display:grid;grid-template-columns:max-content 1fr max-content;gap:6px 12px;align-items:center;font-size:12px}
.bars .b{height:6px;background:var(--bg-l2);border-radius:3px;overflow:hidden}
.bars .b i{display:block;height:100%;background:var(--l2);border-radius:3px}
.bars .lbl{grid-column:1/-1;color:var(--l3);margin-top:6px}
.verdict{border-radius:12px;padding:14px 16px;border:1px solid var(--b2);border-left:3px solid var(--warn);background:var(--bg-base);margin-bottom:16px}
.verdict h4{margin:0 0 6px;font-size:15px}
.verdict ul{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.verdict li{display:flex;gap:8px}
.verdict li .m{flex:none;width:16px;text-align:center;font-weight:700}
.verdict li .m.x{color:var(--err)} .verdict li .m.w{color:var(--warn-ink)}
.score{display:flex;gap:22px;flex-wrap:wrap;margin:6px 0 12px;align-items:flex-end}
.score div{display:flex;flex-direction:column}
.score b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1;font-weight:600}
.score span{font-size:12px;color:var(--l2)}
.score .na b{color:var(--cap)}
.crit{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;font-size:12px;align-items:center}
.crit .h{color:var(--l3)}
.seg{display:inline-flex;border:1px solid var(--b2);border-radius:6px;overflow:hidden}
.seg span{padding:0 7px;line-height:20px;font-size:12px;color:var(--l2)}
.seg span.on{background:var(--pri);color:var(--pri-ink)}
.seg2{display:inline-flex;gap:2px;background:var(--bg-l2);padding:2px;border-radius:8px;font-size:12px}
.seg2 span{padding:2px 10px;border-radius:6px;color:var(--l2)}
.seg2 span.on{background:var(--bg-base);color:var(--l1);box-shadow:0 0 0 1px var(--b2)}
.listgrp{margin-bottom:14px}
.listgrp h5{display:flex;gap:8px;align-items:center;margin:0 0 6px;font-size:13px;font-weight:600}
.listgrp h5 .n{color:var(--l3);font-weight:400}
.xrow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.3fr) max-content max-content;gap:12px;align-items:center;padding:8px 10px;border-radius:10px}
.xrow:hover,.xrow.h{background:var(--hover)}
.xrow .nm b{display:block;font-weight:500}
.xrow .nm span{font-size:12px;color:var(--l2)}
.xrow .meta{font-size:12px;color:var(--l2)}
.toast{position:absolute;right:16px;bottom:16px;max-width:300px;background:var(--pri);color:var(--pri-ink);border-radius:12px;padding:10px 12px;font-size:12px}
.toast b{display:block;font-size:13px}

/* 作答查看 */
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pane{border:1px solid var(--b2);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pane .ph{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--b2);background:var(--bg-l2);flex-wrap:wrap}
.pane .ph b{font-weight:600}
.pane .pb{padding:10px 12px;font-size:13px}
.doc h6{font-size:13px;margin:0 0 4px}
.doc p{margin:0 0 6px;color:var(--l1)}
.doc ul{margin:0 0 6px;padding-left:18px}
.files{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:12px}
.files li{display:flex;gap:8px;padding:3px 0;align-items:center}
.files .st{width:14px;text-align:center;font-weight:700}
.files .st.a{color:var(--ok-ink)} .files .st.m{color:var(--warn-ink)} .files .st.d{color:var(--err)}
.files .nn{margin-left:auto;color:var(--l3)}
.hunk{font-family:var(--mono);font-size:12px;border:1px solid var(--b2);border-radius:8px;overflow:auto;margin-top:8px}
.hunk div{padding:0 8px;white-space:pre}
.hunk .hh{color:var(--l3);background:var(--bg-l2)}
.hunk .ad{background:var(--add)} .hunk .de{background:var(--del)}

<script>
(function(){
  var side=document.getElementById('side').innerHTML;
  var tpls=[].slice.call(document.querySelectorAll('template[data-id]'));
  var nav=document.getElementById('nav'), stage=document.getElementById('stage');
  var ids=tpls.map(function(t){return t.dataset.id});
  var lastGroup=null, n=0;
  tpls.forEach(function(t){
    if(t.dataset.group!==lastGroup){lastGroup=t.dataset.group;var g=document.createElement('div');g.className='grp';g.textContent=lastGroup;nav.appendChild(g);}
    var b=document.createElement('button');b.type='button';b.dataset.id=t.dataset.id;
    var num=document.createElement('b');num.textContent=(t.dataset.group==='用户旅程')?String(++n):'·';
    var s=document.createElement('span');s.textContent=t.dataset.label;
    b.appendChild(num);b.appendChild(s);
    if(t.dataset.new){var nw=document.createElement('span');nw.className='new';nw.textContent='新';b.appendChild(nw);}
    b.addEventListener('click',function(){go(t.dataset.id)});
    nav.appendChild(b);
  });
  function go(id){ if(location.hash==='#'+id) show(id); else location.hash=id; window.scrollTo({top:0}); }
  function show(id){
    var i=ids.indexOf(id); if(i<0){i=0;id=ids[0];}
    stage.innerHTML=tpls[i].innerHTML.split('<!--side-->').join(side);
    [].forEach.call(nav.querySelectorAll('button'),function(b){b.setAttribute('aria-current',b.dataset.id===id?'true':'false')});
    var p=stage.querySelector('.pager');
    if(p){
      if(i>0){var a=document.createElement('button');a.type='button';a.textContent='← '+tpls[i-1].dataset.label;a.onclick=function(){go(ids[i-1])};p.appendChild(a);}else p.appendChild(document.createElement('span'));
      if(i<ids.length-1){var c=document.createElement('button');c.type='button';c.textContent=tpls[i+1].dataset.label+' →';c.onclick=function(){go(ids[i+1])};p.appendChild(c);}
    }
  }
  window.addEventListener('hashchange',function(){show(location.hash.slice(1))});
  document.addEventListener('keydown',function(e){
    var cur=ids.indexOf(location.hash.slice(1)); if(cur<0)cur=0;
    if(e.key==='ArrowRight'&&cur<ids.length-1)go(ids[cur+1]);
    if(e.key==='ArrowLeft'&&cur>0)go(ids[cur-1]);
  });
  show(location.hash.slice(1)||ids[0]);
})();
</script>
