# dsh-web-eval 的评测 pin 层：装置配置，不是个人偏好。
#
# 与 web-dev 的 cordis.patch.yml 不同，本文件**归 pack**：install.sh 与
# update.sh 都覆盖它。理由是这里的每一行都是冻结决策的执行点（README 的
# 「冻结决策」一节），而冻结决策属于评测装置——它决定两格之间「只差一个
# 因子」这句话是否成立。留给用户层的后果是：一次 update 之后，实例可能
# 静默地换了沙箱档位或推理强度，而 run.meta 里记的还是旧值，报告的
# 「受试对象一致」失去意义。web-dev 没有这个约束，那里的 patch 层是用户的。
#
# 要改本文件的任何一行，先开新 run：条件哈希不覆盖 provider 配置（I4 的
# provision 才把它们收进 home.sha），所以这一层的变化在条件哈希上是隐形的，
# 只能靠「装置配置进 git、跑完不改」这条纪律兜住。
#
# 逐条对照冻结决策：
#   2 驱动全 exec        → 四家 live: false（live 是常驻进程：空闲回收、
#                          崩溃续跑、审批自动应答都是额外因子）
#   3 沙箱交给容器边界    → codex sandbox / claude permissionMode / kimi 自动批准
#                          / dsh 无限制，四家一致
#   4 推理强度显式 pin    → kimi thinkingEffort（其余三家的 CLI 没有对应旋钮，
#                          条件文件的 reasoning.effort 记 default）
#   5 端点进条件         → claude 的第三方代理地址
#   12 销毁路径唯一       → 工具按域开放（README 的同名小节）+ 默认预设换成
#                          pack 自带的 eval（不挂 Bash、不挂容器控制）+ 三家
#                          委派工具行 tools: none（预设够不到的那批，见下）
#
# 阶段一二在宿主上直跑，没有容器边界，所以 codex 的 sandbox 取
# workspace-write 而不是 danger-full-access：宿主上给满权限等于把评测的
# 副作用放进真实 home。这条不对称写进 methodology.md，I3 容器化后改回
# danger-full-access，届时四家才真正落在同一档上。

# ── 默认预设（冻结决策 12）──────────────────────────────────────────
# 评测实例的 agent 走 pack 自带的 `eval` 预设：presets/eval/ 随 install.sh 与
# update.sh 落到 $DSH_HOME/.agent-presets/eval（dsh-agent-presets 默认追加的
# 可写根），组成里没有 Bash / pwsh，也没有任何能执行宿主命令的行。预设归 pack
# 的理由与本文件同：它是装置，不是偏好。
#
# 这一行只钉默认值。patch 的 config 覆盖是整块**替换**而不是深合并（见
# vendor/include 的 applyEntryPatches：`target[key] = value`），这里替换掉的是
# web-app bundle 写的 `{default: standard}`，不含别的键，所以什么都没丢；
# `roots`（随发行版的系统预设根）由 apps/cli 的 composeProfile 在本层之后作为
# 最后一层 overlay 追加，`includeUserRoot` 保持 schema 默认 true。
#
# 随发行版的 标准/代码/极简/cordis 四个预设仍在名册上、仍可被人在「设置 →
# Agent 预设」里选中，本层删不掉它们（composeProfile 无条件写 roots）。这条
# 钉的是**新会话默认拿到什么**，不是**人能够到什么**——决策 12 针对的是
# 「agent 误操作」，而 agent 没有切换自身预设的工具，切换是人的动作。
- id: agent-presets
  config:
    default: eval

# ── 工具按域开放（README「工具按域开放」）────────────────────────────
# 执行期没有 agent，写类动词归编排器服务面与人的 CLI。

- id: mission
  config:
    tools: read           # run_list / run_status / list / get 四个读工具

- id: datasets
  config:
    tools: authoring      # 读类全开 + put_item（出题）；worktree_path 留给服务面

- id: eval
  config:
    tools: all            # 本包只注册三个读工具，all 即三个读工具

# ── 委派工具不注册（冻结决策 12 的第三个执行点）──────────────────────
# 前两个执行点在上面：「工具按域开放」（三个机制插件按域注册）与 agent-presets
# 钉成 `eval`（预设组成里没有执行类行）。第三个是这里，家族委派工具。
#
# `subagent_codex` / `subagent_claude_code` / `subagent_kimi` 由各 provider 的
# bundle patch 插在 **profile 根**上，而预设只能挑掉自己挂的行，所以 T21 的
# eval 预设够不到它们——它们每一个都在宿主上起一家 CLI，沙箱按决策 3 放开。
# 评测实例的 agent 因此仍有一条执行宿主命令的路；这三行把它关上。
#
# 关掉的只是**模型可见的工具**。provider 行照挂：编排器驱动选手走 local-agent
# 门面（`packages/eval/src/run.ts` 只用 `LocalAgentFace`，即注册在 `ctx.subagents`
# 上的 provider），`/codex login`、`/kimi status` 这些动词也在 provider 上，
# 两条路都不经这三个工具。评测流一点没变。
#
# **为什么每行都把 `provider` 与 `toolName` 重抄一遍**：patch 的 `config` 是整值
# 替换而不是深合并（`vendor/include` 的 `applyEntryPatches`：`target[key] = value`），
# 只写 `tools: none` 会把 provider 包写的那两个键一并抹掉，而 `provider` 是必填，
# 组合会在 schema 校验上炸掉。`name` 也写上：id 万一被别的插件占了，loader 报
# name mismatch 并跳过这一行，而不是把这份配置塞给另一个插件。
# 这两个键在 `tools: none` 下只用于满足 schema——插件在注册任何东西之前就返回了，
# 谁都没被探测。值抄自各 provider 的 bundle patch 的 insert（`--dump-config` 可核）：
# codex 与 claude-code 的行带 `-local` 后缀（家族 provider 名是 `codex-local` /
# `claude-local`），kimi 的没有。
#
# **第四家 `subagent_dsh` 不在这里，因为它没有配置行。** `local-agent-dsh` 的
# DeepSeek 开关默认关，工具由控制器在开关 ON 时用写死的配置动态挂载
# （`packages/local-agent-dsh/src/index.ts` 里的 `ctx.plugin(toolModule, …)`）。
# 默认状态下它一个工具都不注册，所以本 profile 的工具列表里本就没有它；但**人在
# 「设置 → 本地 Agent」里打开那个开关，`subagent_dsh` 就会带默认 `tools: all`
# 出现**。这一条 profile 层关不掉——要关得改 provider 包，本次任务书划在范围外。
# 与决策 12 的其余部分一样，这钉的是默认值，不是可达集。
- id: tool-subagent-codex-local
  name: '@khorsheed/dsh-local-agent-tool-subagent'
  config:
    provider: codex-local
    toolName: subagent_codex
    tools: none

- id: tool-subagent-claude-code-local
  name: '@khorsheed/dsh-local-agent-tool-subagent'
  config:
    provider: claude-local
    toolName: subagent_claude_code
    tools: none

- id: tool-subagent-kimi
  name: '@khorsheed/dsh-local-agent-tool-subagent'
  config:
    provider: kimi-cli
    toolName: subagent_kimi
    tools: none

# ── 四家选手的评测 pin（冻结决策 2 / 3 / 4 / 5）──────────────────────

- id: local-agent-codex
  config:
    live: false
    sandbox: workspace-write   # 宿主直跑阶段；I3 容器内改 danger-full-access

- id: local-agent-claude-code
  config:
    live: false
    permissionMode: skip
    # 决策 5：claude 的端点是受试对象的一部分，必须进条件。
    # 不 pin 的话 provider 退回宿主进程环境的同名变量——端点就成了「启动实例
    # 的那个 shell 碰巧导出了什么」，换个终端重启即静默换上游，而 run.meta
    # 记的还是旧值。写死在这里，条件文件的 model.endpoint 照抄它。
    #
    # 与 3080 生产 profile 同值：官方端点 + 本机代理出网。
    #
    # 为什么不是宿主环境里那个第三方地址：那条路认证走 API key，而
    # delegationEnv 的放行清单只有 25 个变量（PATH/HOME/proxy 那些），
    # ANTHROPIC_API_KEY 会被 tombstone 掉——provider 也没有传 key 的旋钮，
    # 所以子进程只可能拿订阅 OAuth，而订阅 OAuth 打第三方端点是 401。
    # 3080 的 patch 注释把宿主那个值直呼为 stale，并特意 pin 掉它。
    # docs/players.md 写的 openproxy 路径同样过期，该按实际值更新。
    #
    # proxyUrl 不进 spawn env：provider 的 provisionClaudeHome 把它写进
    # scoped home 的 settings.json 的 env 块（https_proxy/http_proxy），
    # 因为守护进程拉起的实例没有用户 shell 的代理变量。
    baseUrl: https://api.anthropic.com
    proxyUrl: http://127.0.0.1:6152

- id: local-agent-kimi
  config:
    live: false
    thinkingEffort: high       # 与包默认同值，显式写死是为了让它进 git 而不是靠默认

- id: local-agent-dsh
  config:
    live: false
